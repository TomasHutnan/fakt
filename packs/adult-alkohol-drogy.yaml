        why: Z jabĺk je calvados.
      - text: Pije sa neriedená, približne 75 %
        why: Riedi sa na 40 až 55 %.
      - text: Vyrába sa len v Srbsku
        why: Vyrába sa aj inde.
      - text: Luter je číry 96 % lieh
        why: Je zakalený a slabší.
      - text: Čím mladšia, tým lepšia
        why: Staršia je cenenejšia.
      - text: Typicky má okolo 20 %
        why: Pitná sila 40 až 55 %.

  - id: pripitky
    type: pick
    prompt: Ktoré tvrdenia o prípitkoch sú pravdivé?
    difficulty: 1
    source: https://en.wikipedia.org/wiki/Toast_(honor)
    correct:
      - text: Škandinávske skål doslova znamená miska
        why: Odkazuje na staršie pitné nádoby.
      - text: Taliansky cin cin napodobňuje zvuk pohárov
        why: Je to onomatopoja.
      - text: Japonské kanpai doslova znamená vypi do dna
        why: Skoro ako náš „do dna“.
      - text: Nemecké prost pochádza z latinského prosit
        why: Znamená „nech to prospeje“.
      - text: V Nemecku sa pri prípitku pozerá do očí
        why: Inak vraj hrozí sedem rokov smoly.
      - text: V Royal Navy sa nikdy nepripíja vodou
        why: Oslávenec by vraj skončil vo vodnom hrobe.
      - text: Írske sláinte znamená zdravie
        why: Podobne ako naše na zdravie.
    wrong:
      - text: Cinkanie vzniklo, aby sa pri otrave zmiešali nápoje
        why: Skutočný dôkaz tohto pôvodu neexistuje.
      - text: Kanpai znamená dlhý život
        why: Je to vypi do dna.
      - text: Salud je taliansky prípitok
        why: Je španielsky, taliansky je cin cin.
      - text: Prost je pôvodom ruské slovo
        why: Z latinského prosit.
      - text: V Royal Navy sa najradšej pripíja vodou
        why: Je to zlá predzvesť.

