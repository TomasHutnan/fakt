        why: Destiluje sa z modrého agáve.
      - text: vodka
        why: Najčastejšie sa destiluje z obilia alebo zemiakov.
      - text: rum
        why: Destiluje sa z cukrovej trstiny alebo z melasy.
      - text: whisky
        why: Destilát zo sladu a obilnín, dozrieva v sudoch.
      - text: gin
        why: Destilát ochutený hlavne borievkou.
