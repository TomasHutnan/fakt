        why: Je to kvasený ryžový nápoj, nie pálenka.
      - text: pivo
        why: Len kvasí, nedestiluje sa.
      - text: víno
        why: Kvasený hroznový mušt, bez destilácie.
      - text: medovina
        why: Kvasený med, nie pálenka.
      - text: jablkový cider
        why: Kvasený jablkový mušt. Až jeho destilát je calvados.
