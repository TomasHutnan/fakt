  - id: nikdy-nezaznelo
    type: pick
    prompt: "Ktoré z týchto slávnych viet v uvedenom diele alebo situácii v skutočnosti nikdy nezazneli?"
    difficulty: 2
    source: "https://en.wikipedia.org/wiki/Beam_me_up,_Scotty https://en.wikipedia.org/wiki/Play_it_again,_Sam https://en.wikipedia.org/wiki/Sherlock_Holmes https://en.wikipedia.org/wiki/Houston,_we_have_a_problem https://en.wikipedia.org/wiki/AFI%27s_100_Years...100_Movie_Quotes"
    correct:
      - { text: "„Beam me up, Scotty.“ – v seriáloch a filmoch Star Trek", why: "Kapitán Kirk to presne takto nepovedal v žiadnej epizóde ani filme." }
      - { text: "„Play it again, Sam.“ – vo filme Casablanca", why: "Vo filme zaznie „Play it, Sam. Play 'As Time Goes By.'“" }
      - { text: "„Elementary, my dear Watson.“ – v Doylových príbehoch o Sherlockovi Holmesovi", why: "V 60 príbehoch to nie je; povie to až Holmes vo filme z roku 1939." }
      - { text: "„Houston, we have a problem.“ – počas skutočnej misie Apollo 13", why: "Jack Swigert povedal „Okay, Houston … we've had a problem here.“" }
    wrong:
      - { text: "„Play it, Sam.“ – vo filme Casablanca", why: "Presne toto vo filme zaznie." }
      - { text: "„Here's looking at you, kid.“ – vo filme Casablanca", why: "Zaznie; v ankete AFI je na 5. mieste." }
      - { text: "„May the Force be with you.“ – vo filme Hviezdne vojny", why: "Zaznie, a nie raz." }
      - { text: "„Elementary.“ – v Doylovej poviedke The Crooked Man", why: "Watson zvolá „Excellent!“ a Holmes odvetí „Elementary.“" }
      - { text: "„Houston, we have a problem.“ – vo filme Apollo 13 (1995)", why: "Vo filme zaznie práve táto skrátená verzia." }
      - { text: "„Bond. James Bond.“ – vo filme Dr. No", why: "Zaznie; je to prvý bondovský film (1962)." }

  - id: einstein-naozaj
    type: pick
    prompt: "Ktoré z týchto výrokov Albert Einstein preukázateľne povedal alebo napísal?"
    difficulty: 3
    source: "https://en.wikiquote.org/wiki/Albert_Einstein https://quoteinvestigator.com/2017/03/23/same/"
    correct:
      - { text: "Imagination is more important than knowledge.", why: "Fantázia je dôležitejšia ako vedomosti – rozhovor pre Saturday Evening Post, 1929." }
      - { text: "I, at any rate, am convinced that He does not throw dice.", why: "Boh nehrá kocky – list Maxovi Bornovi z decembra 1926." }
      - { text: "Life is like riding a bicycle. To keep your balance you must keep moving.", why: "List synovi Eduardovi, február 1930." }
      - { text: "I have no special talents. I am only passionately curious.", why: "List Carlovi Seeligovi, marec 1952." }
    wrong:
      - { text: "Insanity is doing the same thing over and over and expecting different results.", why: "Šialenstvo je robiť stále to isté… – prvý známy výskyt je z roku 1981 zo svojpomocných skupín pre závislých." }
      - { text: "Everyone is a genius. But if you judge a fish by its ability to climb a tree…", why: "Rybu a strom Einsteinovi podľa Quote Investigatora len pripísali." }
      - { text: "If the bee disappears from the surface of the earth, man would have no more than four years to live.", why: "Včely a štyri roky: doklad od Einsteina neexistuje, výrok sa objavuje až v 60. rokoch." }
      - { text: "Not everything that can be counted counts, and not everything that counts can be counted.", why: "Je z knihy sociológa Williama Brucea Camerona (1963)." }
      - { text: "Time is nature's way of keeping everything from happening at once.", why: "Einsteinovi sa pripisuje až od roku 2008; skôr ho citoval fyzik John Wheeler." }
      - { text: "Everything is energy and that's all there is to it.", why: "Podľa Quote Investigatora niet dôkazu, že to Einstein povedal." }

  - id: churchill-naozaj
    type: pick
    prompt: "Ktoré z týchto výrokov Winston Churchill preukázateľne povedal?"
    difficulty: 3
    source: "https://en.wikiquote.org/wiki/Winston_Churchill https://en.wikipedia.org/wiki/Blood,_toil,_tears_and_sweat"
    correct:
      - { text: "I have nothing to offer but blood, toil, tears, and sweat.", why: "Krv, drina, slzy a pot – prvý prejav v Dolnej snemovni ako premiér, 13. mája 1940." }
