  - id: casablanca-hlasky
    type: pick
    prompt: "Ktoré z týchto viet zaznejú vo filme Casablanca (1942)?"
    difficulty: 2
    source: "https://en.wikipedia.org/wiki/AFI%27s_100_Years...100_Movie_Quotes https://en.wikipedia.org/wiki/Play_it_again,_Sam"
    correct:
      - { text: "Here's looking at you, kid.", why: "V ankete AFI piata najlepšia filmová hláška." }
      - { text: "Louis, I think this is the beginning of a beautiful friendship.", why: "V ankete AFI na 20. mieste." }
      - { text: "Play it, Sam. Play 'As Time Goes By.'", why: "Takto naozaj znie prosba klaviristovi Samovi." }
      - { text: "Round up the usual suspects.", why: "Zatknite obvyklých podozrivých." }
      - { text: "We'll always have Paris.", why: "Vždy nám zostane Paríž." }
      - { text: "Of all the gin joints in all the towns in all the world, she walks into mine.", why: "Zo všetkých barov na svete vošla práve do môjho." }
    wrong:
      - { text: "Play it again, Sam.", why: "Slávny omyl: táto veta vo filme nezaznie, presne je to „Play it, Sam.“" }
      - { text: "Frankly, my dear, I don't give a damn.", why: "Odviate vetrom (1939); víťaz ankety AFI." }
      - { text: "I'm gonna make him an offer he can't refuse.", why: "Krstný otec (1972)." }
      - { text: "May the Force be with you.", why: "Hviezdne vojny (1977)." }
      - { text: "You talkin' to me?", why: "Taxikár (1976)." }
      - { text: "Fasten your seatbelts. It's going to be a bumpy night.", why: "Všetko o Eve (1950)." }

