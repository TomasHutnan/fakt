id: sk-kto-to-povedal
title: Kto to povedal?
description: Slávne vety z českých a slovenských filmov, hollywoodske hlášky, komentátorské výkriky, výroky historických osobností a citáty, ktoré dotyčný v skutočnosti nikdy nepovedal.
lang: sk
license: CC0-1.0
adult: false
version: 1
questions:
  - id: pelisky-hlasky
    type: pick
    prompt: "Ktoré z týchto hlášok zaznejú vo filme Pelíšky (1999)?"
    difficulty: 1
    source: "https://cs.wikiquote.org/wiki/D%C3%ADlo:Pel%C3%AD%C5%A1ky https://www.kfilmu.net/film/pelisky/hlasky/ https://www.nafilmy.com/pelisky/hlasky https://hlaskovstvi.blogspot.com/2019/01/pelisky.html https://www.blesk.cz/clanek/780669 https://cs.wikiquote.org/wiki/D%C3%ADlo:Obecn%C3%A1_%C5%A1kola https://cs.wikiquote.org/wiki/D%C3%ADlo:Vesni%C4%8Dko_m%C3%A1_st%C5%99ediskov%C3%A1 https://cs.wikiquote.org/wiki/D%C3%ADlo:Limon%C3%A1dov%C3%BD_Joe_aneb_Ko%C5%88sk%C3%A1_opera https://cs.wikipedia.org/wiki/J%C3%A1chyme,_ho%C4%8F_ho_do_stroje! https://cs.wikipedia.org/wiki/Mare%C4%8Dku,_podejte_mi_pero! https://cs.wikiquote.org/wiki/D%C3%ADlo:Kolja"
    correct:
      - { text: "Mě by jenom zajímalo, kde udělali soudruzi z NDR chybu.", why: "Otec Kraus (Jiří Kodet); asi najcitovanejšia veta filmu." }
      - { text: "Dávám bolševikovi rok, maximálně dva.", why: "Opäť otec Kraus, presvedčený o skorom páde komunistov." }
      - { text: "Nikdy, nebo navždy!", why: "Kraus takto odpovedá susedovmu chlapcovi, či pôjde Jindra von." }
      - { text: "A skláři nebudou mít co žrát.", why: "Hovorí ju babička (Stella Zázvorková)." }
      - { text: "A komu tím prospějete, co?", why: "Kričí ju otec Šebek (Miroslav Donutil)." }
      - { text: "Mami, to máme zase rajskou?", why: "Pýta sa dcéra Uzlinka Šebková." }
      - { text: "Učitelka a absolutně nepoučitelná!", why: "Hovorí ju otec Šebek." }
    wrong:
      - { text: "Neber úplatky, neber úplatky, nebo se z toho zblázníš.", why: "Jáchyme, hoď ho do stroje! (1974)." }
      - { text: "Hliník se odstěhoval do Humpolce.", why: "Marečku, podejte mi pero! (1976)." }
      - { text: "Alkohol podávaný v malých dávkách neškodí v jakémkoliv množství!", why: "Horác-Hogofogo v Limonádovom Joeovi (1964)." }
      - { text: "Opakuji. Neolizujte železné zábradlí!", why: "Školský rozhlas pána riaditeľa v Obecnej škole (1991)." }
      - { text: "Vy ste se zase kochal, že jo, pane doktore.", why: "Karel Pávek doktorovi Skružnému vo Vesničko má středisková (1985)." }
      - { text: "Hudbu nezajímají rasy a národy.", why: "Zo Svěrákovho filmu Kolja (1996)." }

  - id: ceske-filmy-priradenie
    type: pick
    prompt: "Ktoré dvojice „hláška – film“ sedia?"
    difficulty: 2
    source: "https://cs.wikiquote.org/wiki/D%C3%ADlo:Obecn%C3%A1_%C5%A1kola https://cs.wikiquote.org/wiki/D%C3%ADlo:Vesni%C4%8Dko_m%C3%A1_st%C5%99ediskov%C3%A1 https://cs.wikiquote.org/wiki/D%C3%ADlo:Limon%C3%A1dov%C3%BD_Joe_aneb_Ko%C5%88sk%C3%A1_opera https://cs.wikiquote.org/wiki/D%C3%ADlo:Post%C5%99i%C5%BEiny https://cs.wikiquote.org/wiki/D%C3%ADlo:Kolja https://cs.wikipedia.org/wiki/J%C3%A1chyme,_ho%C4%8F_ho_do_stroje! https://cs.wikipedia.org/wiki/Mare%C4%8Dku,_podejte_mi_pero! https://sk.wikiquote.org/wiki/Pacho,_hybsk%C3%BD_zbojn%C3%ADk"
    correct:
      - { text: "„Neber úplatky, neber úplatky, nebo se z toho zblázníš.“ – Jáchyme, hoď ho do stroje!", why: "Hláška tak zľudovela, že ju ľudia citovali aj pri vybavovaní na úradoch." }
      - { text: "„Hliník se odstěhoval do Humpolce.“ – Marečku, podejte mi pero!", why: "Veta sa ujala tak, že má v Humpolci vlastné múzeum." }
      - { text: "„Kolaloka, to je zákon!“ – Limonádový Joe", why: "Hrdina, ktorý pije len Kolalokovu limonádu." }
      - { text: "„Pan Chroust je blbec!“ – Obecná škola", why: "Otec Souček (Zdeněk Svěrák) synovi Edovi." }
      - { text: "„Vy jednou špatně skončíte, pane doktore.“ – Vesničko má středisková", why: "Pávek doktorovi Skružnému; ten odpovedá: „To každej, Karle.“" }
      - { text: "„Pro mě za mě, vlezte si třeba na komín.“ – Postřižiny", why: "Francin (Jiří Schmitzer) v Menzelovom filme podľa Hrabala." }
      - { text: "„Keď sú páni, aj zbojníci musia byť!“ – Pacho, hybský zbojník", why: "Slovenská komédia z roku 1975." }
    wrong:
      - { text: "„Neber úplatky, neber úplatky, nebo se z toho zblázníš.“ – Pelíšky", why: "Je z filmu Jáchyme, hoď ho do stroje! (1974)." }
      - { text: "„Hliník se odstěhoval do Humpolce.“ – Obecná škola", why: "Je z filmu Marečku, podejte mi pero! (1976)." }
      - { text: "„Kolaloka, to je zákon!“ – Vesničko má středisková", why: "Patrí Limonádovému Joeovi." }
      - { text: "„Pan Chroust je blbec!“ – Pelíšky", why: "Je z Obecnej školy." }
      - { text: "„Pro mě za mě, vlezte si třeba na komín.“ – Kolja", why: "Je z Postřižin (1980)." }
      - { text: "„Keď sú páni, aj zbojníci musia byť!“ – Jánošík", why: "Je z Pacha, hybského zbojníka." }

  - id: pelisky-nikdy-nebo-navzdy
    type: choice
    prompt: "Kto v Pelíškoch odpovie susedovmu chlapcovi na otázku, či pôjde Jindra von: „Nikdy, nebo navždy!“?"
    difficulty: 1
    source: "https://www.nafilmy.com/pelisky/hlasky https://www.kfilmu.net/film/pelisky/hlasky/ https://hlaskovstvi.blogspot.com/2019/01/pelisky.html"
    correct: { text: "Otec Kraus (Jiří Kodet)", why: "Bývalý vojak a vojnový invalida, otec Jindry." }
    wrong:
      - { text: "Otec Šebek (Miroslav Donutil)", why: "Jeho hláška je „A komu tím prospějete, co?“" }
      - { text: "Babička (Stella Zázvorková)", why: "Jej patrí „A skláři nebudou mít co žrát.“" }
      - { text: "Strýc Václav", why: "Jeho hláška je „No, kdo? Ježíšek, přece!“" }

  - id: obecna-skola-rozhlas
    type: choice
    prompt: "Kto v Obecnej škole vyhlasuje školským rozhlasom „Neolizujte železné zábradlí! Neolizujte ani namrzlé kliky dveří!“?"
    difficulty: 2
    source: "https://cs.wikiquote.org/wiki/D%C3%ADlo:Obecn%C3%A1_%C5%A1kola"
    correct: { text: "Pán riaditeľ (Rudolf Hrušínský)", why: "Ten istý riaditeľ pozýva rodičov, „kteří chtějí vidět Idiota“, do riaditeľne." }
    wrong:
      - { text: "Učiteľ Igor Hnízdo (Jan Tříska)", why: "Ten sa triede predstaví úderom do tabule so svojím menom." }
      - { text: "Otec Souček (Zdeněk Svěrák)", why: "Ten sa doma rozčuľuje na pána Chrousta." }
      - { text: "Učiteľka Maxová (Daniela Kolářová)", why: "Tá sa vyhráža Rosenheimovi preradením do Vršovíc." }

  - id: limonadovy-joe-alkohol
    type: choice
    prompt: "Kto v Limonádovom Joeovi tvrdí: „Alkohol podávaný v malých dávkách neškodí v jakémkoliv množství!“?"
    difficulty: 2
    source: "https://cs.wikiquote.org/wiki/D%C3%ADlo:Limon%C3%A1dov%C3%BD_Joe_aneb_Ko%C5%88sk%C3%A1_opera"
    correct: { text: "Horác-Hogofogo (Miloš Kopecký)", why: "Darebák, ktorý má aj hlášku „Setřu tvůj pel, poupátko.“" }
    wrong:
      - { text: "Limonádový Joe (Karel Fiala)", why: "Ten pije výhradne limonádu: „Kolaloka, to je zákon!“" }
      - { text: "Grimpo (Josef Hlinomaz)", why: "Ten predstavuje svojich spolupracovníkov Kojota Kida a Pancha Kida." }
      - { text: "Šerif", why: "Ten hovorí, že keď strieľa konzument Kolalokovej limonády, netreba volať lekára." }

  - id: vesnicko-kochal
    type: choice
    prompt: "Kto vo filme Vesničko má středisková hovorí: „Vy ste se zase kochal, že jo, pane doktore“?"
    difficulty: 1
    source: "https://cs.wikiquote.org/wiki/D%C3%ADlo:Vesni%C4%8Dko_m%C3%A1_st%C5%99ediskov%C3%A1"
    correct: { text: "Šofér Karel Pávek (Marián Labuda)", why: "Vyčíta to doktorovi Skružnému, ktorý sa za volantom kochá." }
    wrong:
      - { text: "Doktor Skružný (Rudolf Hrušínský)", why: "Je to ten, kto sa kochá; odpovedá „Vono to snad nemá brzdy nebo co.“" }
      - { text: "Závozník Otík (János Bán)", why: "O ňom Pávek hovorí, že v Berouně povie „Beroun“ a má vystaráno." }
      - { text: "Otec Souček (Zdeněk Svěrák)", why: "Je to postava z Obecnej školy." }

  - id: pacho-zbojnici
    type: choice
    prompt: "Z ktorého filmu je veta „Keď sú páni, aj zbojníci musia byť!“?"
    difficulty: 1
    source: "https://sk.wikiquote.org/wiki/Pacho,_hybsk%C3%BD_zbojn%C3%ADk https://www.teraz.sk/ms-v-hokeji-2022/bondra-zlaty-gol-ktory-som-dal-bol/632449-clanok.html"
    correct: { text: "Pacho, hybský zbojník", why: "Slovenská komédia z roku 1975; ďalšia hláška: „Kto sa smeje naposledy, ten má dlhé vedenie!“" }
    wrong:
      - { text: "Tisícročná včela", why: "Iný slovenský film; zbojnícku komédiu točili o Pachovi." }
      - { text: "Perinbaba", why: "Rozprávka, nie zbojnícka komédia." }
      - { text: "Slnko v sieti", why: "Dráma Štefana Uhera, o zbojníkoch nie je." }

