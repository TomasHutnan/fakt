      - text: ATL - Atlanta
        why: Najrušnejšie letisko sveta.
      - text: DXB - Dubaj
        why: Druhé najrušnejšie letisko sveta a číslo jedna v medzinárodnej doprave.
      - text: LHR - Londýn Heathrow
        why: Najznámejšie z londýnskych letísk.
      - text: HND - Tokio Haneda
        why: Hlavné letisko japonskej metropoly.
      - text: SIN - Singapur Changi
        why: Odtiaľ vychádza najdlhšia pravidelná linka na svete.
    wrong:
