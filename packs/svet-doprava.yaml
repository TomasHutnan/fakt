      - text: Boeing 787
        why: Vyrába sa naďalej.
      - text: Airbus A320
        why: Vyrába sa naďalej, ako A320neo.
      - text: Airbus A350
        why: Vyrába sa naďalej.
      - text: Airbus A330
        why: Vyrába sa naďalej, ako A330neo.

  - id: concorde-tvrdenia
    type: pick
    prompt: Ktoré tvrdenia o nadzvukovom lietadle Concorde sú pravdivé?
    difficulty: 2
    tags: [lietadlá]
    source: https://www.npr.org/2023/11/24/1211551109/concorde-last-flight-2003
    correct:
      - text: Z New Yorku do Londýna preletel približne za 3,5 hodiny
        why: Atlantik prekonal dvojnásobne rýchlejšie ako bežné lietadlo.
      - text: Letel dvojnásobkom rýchlosti zvuku
        why: Prekračoval zvukovú bariéru nad Atlantikom.
      - text: Bol spoločným projektom Británie a Francúzska
        why: Preto sa spája s dvoma aerolíniami.
      - text: Lietali s ním British Airways a Air France
        why: Spoločnosti z oboch krajín projektu.
      - text: Prvý komerčný let do USA mal v máji 1976
        why: Z Londýna pristál na letisku Dulles pri Washingtone.
      - text: Naposledy letel 26. novembra 2003
        why: Z Heathrow pristál v Bristole.
    wrong:
      - text: Vyrobila ho americká firma Boeing
        why: Bol to britsko-francúzsky projekt.
      - text: Mohol prepraviť viac ako 400 cestujúcich
        why: Mal len asi 100 miest.
      - text: Letel približne rovnako rýchlo ako bežné osobné lietadlá
        why: Letel dvojnásobkom rýchlosti zvuku.
      - text: Posledný let absolvoval v roku 2010
        why: Posledný let bol v roku 2003.
      - text: Prvý komerčný let do USA mal až v 90. rokoch
        why: Do USA letel už v máji 1976.

  - id: tenerife-tvrdenia
    type: pick
    prompt: Ktoré tvrdenia o najtragickejšej nehode v histórii letectva (zrážka dvoch lietadiel na Kanárskych ostrovoch) sú pravdivé?
    difficulty: 2
    tags: [nehody]
    source: https://www.faa.gov/lessons_learned/transport_airplane/accidents/PH-BUF
    note: Opis nehody podľa americkej leteckej správy FAA (Lessons Learned).
    correct:
      - text: Išlo o dva Boeingy 747
        why: Lietadlá spoločností KLM a Pan Am.
      - text: Lietadlá presmerovali na Tenerife kvôli bombe na letisku na Gran Canarii
        why: Cieľové letisko Las Palmas bolo po výbuchu dočasne neprístupné.
      - text: K zrážke došlo na dráhe, nie vo vzduchu
        why: Jedno lietadlo sa rozbiehalo na vzlet a druhé pojazdovalo po tej istej dráhe.
      - text: Zahynulo 583 ľudí
        why: Šlo o najtragickejšiu nehodu v histórii letectva.
      - text: Z lietadla KLM neprežil nikto
        why: Zahynulo všetkých 248 ľudí na palube.
      - text: Z lietadla Pan Am prežilo 61 ľudí
        why: Zvyšných 335 obetí bolo na palube Pan Am.
    wrong:
      - text: Lietadlá sa zrazili vo vzduchu nad oceánom
        why: Zrazili sa na dráhe letiska.
      - text: Zrážka sa stala na letisku Las Palmas na Gran Canarii
        why: Stala sa na Tenerife, na Gran Canarii bola bomba.
      - text: Jedným z lietadiel bol Concorde
        why: Boli to dva Boeingy 747.
      - text: Z lietadla Pan Am neprežil nikto
        why: Prežilo 61 ľudí.
      - text: Nehoda sa stala v roku 1987
        why: Stala sa v roku 1977.

