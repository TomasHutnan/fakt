    items:
      - { text: Gotthardský bázový tunel (Švajčiarsko), value: 57, why: "Najdlhší železničný tunel sveta, otvorený 2016." }
      - { text: Tunel Seikan (Japonsko), value: 53.85, why: "Spája Honšú a Hokkaidó, dlhý 53,85 km." }
      - { text: Lamanšský tunel (Francúzsko - Británia), value: 50, why: "Okolo 50 km, z toho asi 37 km pod morom." }
      - { text: Lötschbergský bázový tunel (Švajčiarsko), value: 34.6, why: "Menší brat Gotthardu, dlhý 34,6 km." }

  - id: rekordy-rychlost-vlakov
    type: order
    prompt: Zoraď tieto vlaky podľa najvyššej rýchlosti, ktorú dosiahli, od najrýchlejšieho.
    direction: desc
    unit: km/h
    difficulty: 3
    tags: [vlaky]
    asOf: "2026-11"
    source: https://www.guinnessworldrecords.com/world-records/fastest-maglev-train/
    note: Maglev - Guinness (603 km/h, 2015); TGV 2007 a 1990 - https://www.alstom.com/press-releases-news/2007/4/alstom-rff-and-sncf-set-a-new-world-rail-speed-record-of-574kmh ; Shinkansen - https://www.asme.org/about-asme/who-we-are/engineering-history/landmarks/211-tokaido-shinkansen (okolo 210 km/h pri otvorení).
    items:
      - { text: Japonský maglev L0 (rekord 2015), value: 603, why: "Vznášajúci sa vlak, najrýchlejší vlak vôbec." }
      - { text: Francúzske TGV V150 (rekord 2007), value: 574.8, why: "Rekord vlaku na kolesách." }
      - { text: Francúzske TGV Atlantique (rekord 1990), value: 515.3, why: "Predošlý rekord, ktorý trval do roku 2007." }
      - { text: Japonský Šinkansen pri otvorení (1964), value: 210, why: "Prvá vysokorýchlostná trať sveta jazdila približne 210 km/h." }

