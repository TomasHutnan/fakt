id: svet-doprava
title: Doprava vo svete
description: Letiská, lietadlá, metro, tunely, mosty, prieplavy a rýchle vlaky z celého sveta.
category: veda
lang: sk
license: CC0-1.0
adult: false
version: 2
questions:
  # ---------------------------------------------------------------- pick
  - id: letiska-top5-2024
    type: pick
    prompt: Ktoré z týchto letísk patrili v roku 2024 medzi päť najvyťaženejších na svete podľa počtu cestujúcich?
    difficulty: 2
    tags: [letiská]
    asOf: "2024"
    source: https://blog.aci.aero/airport-economics/busiest-airports-in-the-world-2024/
    note: Poradie podľa ACI World (2024). Prvé tri miesta potvrdzuje aj https://aci.aero/2025/04/14/the-busiest-airports-in-the-world-defy-global-uncertainty-and-hold-top-rankings/ .
    correct:
      - text: Atlanta (Hartsfield-Jackson)
        why: Najrušnejšie letisko sveta, v roku 2024 cez 108 miliónov cestujúcich.
      - text: Dubaj (DXB)
        why: Druhé najrušnejšie letisko sveta.
      - text: Dallas/Fort Worth
        why: Tretie najrušnejšie letisko sveta, obrovský prestupný uzol amerických aerolínií.
      - text: Londýn Heathrow
        why: Jedno z piatich najrušnejších letísk sveta.
      - text: Tokio Haneda
        why: Hlavné letisko japonskej metropoly, v prvej päťke sveta.
    wrong:
      - text: Frankfurt
        why: Veľký európsky uzol, ale do prvej päťky sa nedostal.
      - text: Amsterdam Schiphol
        why: Rušné, no vo svetovom poradí ďaleko za prvou päťkou.
      - text: Singapur Changi
        why: Slávne svojou kvalitou, počtom cestujúcich však nepatrí do prvej päťky.
      - text: Hongkong
        why: Číslo jedna je v nákladnej doprave, nie v počte cestujúcich.
      - text: Madrid Barajas
        why: Najväčšie letisko Španielska, do svetovej prvej päťky ale nepatrí.
      - text: Viedeň Schwechat
        why: Najbližšie veľké letisko pre Slovákov, vo svetovom rebríčku je však hlboko pod prvou päťkou.
      - text: Bratislava (M. R. Štefánika)
        why: Je to malé letisko; od prvej päťky ho delia desiatky miliónov cestujúcich.

  - id: letiska-aci-tvrdenia
    type: pick
    prompt: Ktoré tvrdenia o letiskách podľa rebríčkov ACI World za rok 2024 sú pravdivé?
    difficulty: 3
    tags: [letiská]
    asOf: "2024"
    source: https://blog.aci.aero/airport-economics/busiest-airports-in-the-world-2024/
    note: Medzinárodnú dopravu (Dubaj 92,3 mil.) a poradie za Dubajom opisuje https://moodiedavittreport.com/dubai-tops-airport-international-passenger-traffic-rankings-atlanta-busiest-overall ; Pudong a top 10 - https://aci.aero/2025/04/14/the-busiest-airports-in-the-world-defy-global-uncertainty-and-hold-top-rankings/ .
    correct:
      - text: Dubaj bol najrušnejším letiskom sveta v medzinárodnej doprave
        why: Obslúžil 92,3 milióna medzinárodných cestujúcich.
      - text: Druhým najrušnejším letiskom v medzinárodnej doprave bol Heathrow
        why: V tomto rebríčku skončil hneď za Dubajom, pred Inčchonom, Changi a Schipholom.
      - text: Najviac tovaru sa prepravilo cez Hongkong
        why: Číslo jedna v nákladnej doprave, pred Šanghajom Pchu-tung a Memphisom.
      - text: Šanghaj Pchu-tung sa posunul z 21. na 10. miesto
        why: Bol to najväčší skok v prvej desiatke.
      - text: Celosvetovo prešlo letiskami približne 9,4 miliardy cestujúcich (predbežné údaje)
        why: O 8,4 % viac ako v roku 2023 a o 2,7 % viac ako v roku 2019.
    wrong:
      - text: Dubaj bol najrušnejším letiskom sveta v celkovom počte cestujúcich
        why: V celkovom počte bola prvá Atlanta, Dubaj druhý.
      - text: Najviac tovaru sa prepravilo cez Memphis
        why: Memphis je v nákladnej doprave tretí.
      - text: Frankfurt sa dostal do svetovej prvej päťky
        why: V prvej päťke sú Atlanta, Dubaj, Dallas/Fort Worth, Heathrow a Haneda.
      - text: Počet cestujúcich vo svete ostal pod úrovňou roku 2019
        why: Rok 2024 bol o 2,7 % nad rokom 2019.
      - text: Najrušnejšie letisko Európy leží v Bratislave
        why: Bratislava je malé letisko, ďaleko od európskej špičky.
      - text: Prvá desiatka letísk obslúžila viac ako polovicu všetkých cestujúcich sveta
        why: Desať najrušnejších letísk obslúžilo 855 miliónov cestujúcich, teda len okolo 9 % svetovej dopravy.

  - id: kody-letisk
