id: svet-doprava
title: Doprava vo svete
description: Letiská, lietadlá, metro, tunely, mosty, prieplavy a rýchle vlaky z celého sveta.
category: veda
lang: sk
license: CC0-1.0
adult: false
version: 1
questions:
  # ---------------------------------------------------------------- pick
  - id: letiska-top5-2024
    type: pick
    prompt: Ktoré z týchto letísk patrili v roku 2024 medzi päť najvyťaženejších na svete podľa počtu cestujúcich?
    difficulty: 2
    tags: [letiská]
    asOf: "2024"
    source: https://blog.aci.aero/airport-economics/busiest-airports-in-the-world-2024/
    note: Poradie podľa ACI World (2024). Druhý zdroj https://aci.aero/2025/04/14/the-busiest-airports-in-the-world-defy-global-uncertainty-and-hold-top-rankings/ potvrdzuje prvé tri miesta.
    correct:
      - text: Atlanta (Hartsfield-Jackson)
        why: Najrušnejšie letisko sveta, v roku 2024 cez 108 miliónov cestujúcich.
      - text: Dubaj (DXB)
        why: Druhé najrušnejšie a zároveň číslo jedna v medzinárodnej doprave (92,3 milióna cestujúcich).
      - text: Dallas/Fort Worth
        why: Tretie najrušnejšie letisko sveta, obrovský prestupný uzol amerických aerolínií.
      - text: Londýn Heathrow
        why: Najrušnejšie letisko Európy, v svetovom rebríčku v prvej päťke.
      - text: Tokio Haneda
        why: Hlavné letisko japonskej metropoly, v prvej päťke sveta.
    wrong:
      - text: Frankfurt
        why: Veľký európsky uzol, ale do prvej päťky sa nedostal.
      - text: Amsterdam Schiphol
        why: Rušné, no v svetovom poradí ďaleko za prvou päťkou.
      - text: Singapur Changi
        why: Slávne svojou kvalitou, počtom cestujúcich však nepatrí do prvej päťky.
      - text: Hongkong
        why: Číslo jedna je v nákladnej doprave, nie v počte cestujúcich.
      - text: Madrid Barajas
        why: Najväčšie letisko Španielska, do svetovej prvej päťky ale nepatrí.
      - text: Viedeň Schwechat
        why: Najbližšie veľké letisko pre Slovákov, v svetovom rebríčku je však hlboko pod prvou päťkou.
      - text: Bratislava (M. R. Štefánika)
        why: Aj s lietadlami lowcostov je to len zlomok percenta z objemu najväčších letísk.

  - id: airbus-lietadla
    type: pick
    prompt: Ktoré z týchto lietadiel postavil Airbus?
    difficulty: 1
    tags: [lietadlá]
    source: https://www.airbus.com/en/products-services/commercial-aircraft/passenger-aircraft
    note: Zoznam súčasnej ponuky Airbusu (A220, A320, A330, A350, A380). Boeing má vlastnú ponuku https://www.boeing.com/commercial.
    correct:
      - text: A380
        why: Najväčšie osobné lietadlo sveta s dvomi plnými poschodiami.
      - text: A350
        why: Moderné dvojmotorové dopravné lietadlo s dlhým doletom.
      - text: A320
        why: Najznámejšie úzkotrupé lietadlo, na ktorom lietajú aj mnohé nízkonákladové aerolínie.
      - text: A330
        why: Dvojmotorové širokotrupé lietadlo, dnes ako A330neo.
      - text: A220
        why: Menšie úzkotrupé lietadlo, pôvodne vyvinuté pod značkou Bombardier CSeries.
    wrong:
      - text: Boeing 737
        why: Najznámejší konkurent A320 a flagship Boeingu.
      - text: Boeing 747
        why: Slávny „jumbo jet“, ktorý vyrábal Boeing do roku 2023.
      - text: Boeing 777
        why: Širokotrupé lietadlo Boeingu pre dlhé lety.
      - text: Boeing 787
        why: Dreamliner, širokotrupé lietadlo Boeingu.
      - text: Embraer E190
        why: Regionálne lietadlo brazílskej firmy Embraer.
      - text: Tupolev Tu-154
        why: Sovietske trojmotorové lietadlo, ktoré kedysi lietalo aj v Československu.

  - id: prieplavy-umele
    type: pick
    prompt: Ktoré z týchto vodných ciest vykopali ľudia (sú to umelé prieplavy)?
    difficulty: 1
    tags: [lode, prieplavy]
    source: https://www.suezcanal.gov.eg/English/About/SuezCanal/Pages/CanalCharacteristics.aspx
    note: Panamský prieplav https://pancanal.com/en/panama-canal-turns-90/ , Korintský https://www.visitgreece.gr/en/experiences/activities/sport-activities/corinth-canal , Kielský https://www.hafen-hamburg.de/en/portofhamburg/kiel-canal/ . Druhý zdroj Wikipedia.
    correct:
      - text: Suezský prieplav
        why: Spája Stredozemné a Červené more, otvorený 1869.
      - text: Panamský prieplav
        why: Spája Atlantik s Tichým oceánom, otvorený v auguste 1914.
      - text: Kielský prieplav
        why: Spája Severné a Baltské more cez Nemecko, otvorený v roku 1895.
      - text: Korintský prieplav
        why: Úzky zárez cez šiju v Grécku, dlhý len asi 6,3 km.
    wrong:
      - text: Gibraltársky prieliv
        why: Prirodzený prieliv medzi Španielskom a Marokom.
      - text: Bospor
        why: Prirodzený prieliv cez Istanbul.
      - text: Dardanely
        why: Prirodzený prieliv medzi Egejským a Marmarským morom.
      - text: Lamanšský prieliv
        why: Prirodzený prieliv medzi Britániou a Francúzskom (pod ním vedie tunel, nie prieplav).
      - text: Magalhãesov prieliv
        why: Prirodzený prieliv pri južnom cípe Južnej Ameriky.
      - text: Ormuzský prieliv
        why: Prirodzený prieliv medzi Perzským a Ománskym zálivom.
      - text: Beringov prieliv
        why: Prirodzený prieliv medzi Áziou a Amerikou.

  - id: metro-mesta
    type: pick
    prompt: Ktoré z týchto európskych miest majú metro (podzemnú dráhu)?
    difficulty: 2
    tags: [metro]
    asOf: "2026-11"
    source: https://www.urbanrail.net/eu/euromet.htm
    note: Zoznam európskych metier podľa UrbanRail.net, bez ľahkých električkových systémov.
    correct:
      - text: Budapešť
        why: Najstaršie metro na európskej pevnine, otvorené 1896.
      - text: Praha
        why: Metro funguje od roku 1974 a má tri trasy.
      - text: Viedeň
        why: Metro (U-Bahn) má viacero liniek.
      - text: Varšava
        why: Metro má od roku 1995.
      - text: Sofia
        why: Hlavné mesto Bulharska má metro.
      - text: Kyjev
        why: Metro funguje od roku 1960.
      - text: Atény
        why: Metro je v meste pomerne mladé a ukrýva nálezy z antiky.
      - text: Lisabon
        why: Portugalské hlavné mesto má vlastné metro.
    wrong:
      - text: Bratislava
        why: Metro sa v meste už dlho plánuje, no zatiaľ nejazdí.
      - text: Brno
        why: Druhé najväčšie české mesto jazdí na električkách a trolejbusoch, metro nemá.
      - text: Zürich
        why: Má električky a S-Bahn, metro nie.
      - text: Ženeva
        why: Doprava stojí na električkách a trolejbusoch, nie na metre.
      - text: Edinburgh
        why: Jazdí tu električka, metro nie.
      - text: Krakov
        why: Veľké poľské mesto bez metra.
      - text: Ľubľana
        why: Slovinské hlavné mesto metro nemá.

  - id: tunely-zeleznicne
    type: pick
    prompt: Ktoré z týchto tunelov sú železničné (jazdia nimi vlaky)?
    difficulty: 2
    tags: [tunely]
    source: https://www.railway-technology.com/projects/gotthard-base-tunnel/
    note: Gotthardský a Lötschbergský bázový a Cenerský tunel podľa railway-technology.com; Lamanšský tunel https://www.getlinkgroup.com/uk/the-channel-tunnel/ ; Seikan https://structurae.net/en/structures/seikan-tunnel ; Lærdal https://www.vegvesen.no/en/road-projects/project/e16lardalstunnelen/ .
    correct:
      - text: Gotthardský bázový tunel
        why: Najdlhší železničný tunel sveta, 57 km pod Alpami vo Švajčiarsku.
      - text: Lamanšský tunel
        why: Vlaky Eurostar aj kamióny a autá na prepravných vlakoch Le Shuttle.
      - text: Tunel Seikan
        why: Spája japonské ostrovy Honšú a Hokkaidó pod prielivom Cugaru.
      - text: Lötschbergský bázový tunel
        why: Švajčiarsky železničný tunel dlhý 34,6 km.
      - text: Cenerský bázový tunel
        why: Dopĺňa Gotthardský tunel, dlhý 15,4 km a otvorený v roku 2020.
    wrong:
      - text: Lærdalský tunel
        why: Nórsky cestný tunel dlhý 24,5 km, najdlhší cestný tunel sveta.
      - text: Tunel pod Mont Blancom
        why: Cestný tunel medzi Francúzskom a Talianskom.
      - text: Arlberský cestný tunel
        why: Rakúsky cestný tunel pod horským priesmykom Arlberg.
      - text: Tunel Eiksund
        why: Nórsky cestný tunel pod fjordom.
      - text: Tunel Gran Sasso
        why: Talianska diaľnica A24 vedie pod pohorím Gran Sasso.

  # ---------------------------------------------------------------- order
  - id: najdlhsie-zeleznicne-tunely
    type: order
