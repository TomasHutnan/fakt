      - text: Praha
        why: Prvý úsek metra otvorili v roku 1974.
      - text: Viedeň
        why: Dnešné metro (U-Bahn) vzniklo postupne od 70. rokov.
      - text: Varšava
        why: Prvú linku otvorili v apríli 1995.
      - text: Sofia
        why: Prvá linka sa otvorila v roku 1998.
      - text: Kyjev
        why: Prvý úsek otvorili v roku 1960.
      - text: Atény
        why: Jedna linka vychádza z prvej gréckej železnice z roku 1869, dve moderné pribudli neskôr.
      - text: Lisabon
        why: Prvý úsek otvorili v roku 1959.
    wrong:
      - text: Bratislava
        why: Metro v meste nie je, jazdia električky, trolejbusy a autobusy.
      - text: Brno
        why: Druhé najväčšie české mesto jazdí na električkách a trolejbusoch, metro nemá.
