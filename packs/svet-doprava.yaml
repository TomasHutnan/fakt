  - id: airbus-lietadla
    type: pick
    prompt: Ktoré z týchto lietadiel postavil Airbus?
    difficulty: 1
    tags: [lietadlá]
    source: https://www.airbus.com/en/products-services/commercial-aircraft/passenger-aircraft
    note: Zoznam ponuky Airbusu (A220, A320, A330, A350, A380). Boeing má vlastnú ponuku https://www.boeing.com/commercial .
    correct:
      - text: A380
        why: Najväčšie osobné lietadlo sveta s dvoma plnými poschodiami.
      - text: A350
        why: Moderné dvojmotorové dopravné lietadlo s dlhým doletom.
      - text: A320
        why: Najznámejšie úzkotrupé lietadlo, na ktorom lietajú aj mnohé nízkonákladové aerolínie.
      - text: A330
        why: Dvojmotorové širokotrupé lietadlo, dnes ako A330neo.
      - text: A220
        why: Menšie úzkotrupé lietadlo, pôvodne vyvinuté pod značkou Bombardier CSeries.
    wrong:
      - text: "737"
        why: Boeing 737, najznámejší konkurent A320.
      - text: "747"
        why: Boeing 747, slávny „jumbo jet“.
      - text: "777"
        why: Boeing 777, širokotrupé lietadlo pre dlhé lety.
      - text: "787"
        why: Boeing 787 Dreamliner, širokotrupé lietadlo.
      - text: Embraer E190
        why: Regionálne lietadlo brazílskej firmy Embraer.
      - text: Tu-154
        why: Tupolev Tu-154, sovietske trojmotorové lietadlo.

