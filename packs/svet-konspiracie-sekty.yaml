title: Konšpirácie a sekty
description: "Čo je overený fakt a čo výmysel: tajné operácie, konšpiračné teórie, prieskumy, ktorým ľudia veria, a sekty, ktoré sa zapísali do dejín."
category: historia
lang: sk
license: CC0-1.0
adult: false
version: 3
questions:
  # ================================================================ KONŠPIRÁCIE
  # ---------------------------------------------------------------- pick
  - id: kons-realne-alebo-teoria
    type: pick
    prompt: "Ktoré z týchto vecí sa naozaj stali alebo naozaj existovali (sú doložené odtajnenými dokumentmi či vyšetrovaním), hoci znejú ako konšpirácia?"
    difficulty: 2
    tags: [konšpirácie]
    source: "https://en.wikipedia.org/wiki/MKUltra https://en.wikipedia.org/wiki/Operation_Northwoods https://en.wikipedia.org/wiki/Tuskegee_Syphilis_Study https://en.wikipedia.org/wiki/COINTELPRO https://en.wikipedia.org/wiki/Operation_Paperclip https://en.wikipedia.org/wiki/Operation_Sea-Spray"
    correct:
      - { text: "Projekt MKUltra", why: "Program CIA z rokov 1953 – 1972, ktorý podával ľuďom bez ich súhlasu drogy, najmä LSD." }
      - { text: "Operácia Northwoods", why: "Skutočný plán amerických náčelníkov štábov z roku 1962 na zinscenované útoky ako zámienku proti Kube; nikdy sa neuskutočnil." }
      - { text: "Štúdia syfilisu v Tuskegee", why: "Americká štátna zdravotná služba v rokoch 1932 – 1972 nechávala chorých mužov bez liečby a nepovedala im diagnózu." }
      - { text: "COINTELPRO", why: "Tajný program FBI z rokov 1956 – 1971 na sledovanie a rozkladanie politických skupín." }
      - { text: "Operácia Paperclip", why: "USA po vojne tajne previezli viac ako 1 600 nemeckých vedcov a technikov z nacistického Nemecka." }
      - { text: "Operácia Sea-Spray", why: "V roku 1950 americké námorníctvo tajne rozprašovalo baktérie nad oblasťou San Francisca, aby otestovalo biologický útok." }
      - { text: "Aféra Watergate", why: "Vlámanie do sídla demokratov a jeho zakrývanie viedli v roku 1974 k odstúpeniu prezidenta Nixona." }
    wrong:
      - { text: "Sfalšované pristátie na Mesiaci", why: "Vyvrátená teória; šesť pristátí Apolla v rokoch 1969 – 1972 sa naozaj uskutočnilo." }
      - { text: "Chemtrails", why: "Vyvrátená teória; biele pásy za lietadlami sú kondenzačné stopy z vodnej pary." }
      - { text: "Plazí ľudia (reptiliáni) vládnu svetu", why: "Teória, ktorú spopularizoval David Icke; nemá žiadny dôkaz." }
      - { text: "Birds Aren't Real (vtáky sú vládne drony)", why: "Zámerne satirická „teória“, ktorú si v roku 2017 vymyslel Peter McIndoe." }
      - { text: "Paul McCartney zomrel v roku 1966", why: "Fáma z konca 60. rokov; McCartney žije a v roku 1969 to vyvrátil v rozhovore pre Life." }
      - { text: "Nemecké mesto Bielefeld neexistuje", why: "Žartovná teória z roku 1994; Bielefeld má vyše 340 000 obyvateľov." }
      - { text: "Karol Veľký nikdy nežil (fantómový čas)", why: "Pseudohistorická teória Heriberta Illiga z roku 1991; vyvracajú ju archeológia aj astronomické záznamy." }
      - { text: "Pád UFO v Roswelli", why: "Trosky z roku 1947 pochádzali z tajného balónového projektu Mogul, nie z mimozemskej lode." }

