      - { text: kôpor, why: "Kôpor robí kôprovú omáčku, iné jedlo." }
      - { text: sušené hríby, why: "Hríbová omáčka je iné jedlo, do sviečkovej sa nedávajú." }
      - { text: mletá pálivá paprika, why: "Paprika patrí do gulášu, omáčka na sviečkovú je bez nej." }
      - { text: ryža, why: "Ku sviečkovej patrí knedľa, nie ryža." }

  - id: carbonara-suroviny
    type: pick
    prompt: Čo patrí do carbonary tak, ako ju dnes bežne varia v Taliansku?
    difficulty: 2
    source: https://en.wikipedia.org/wiki/Carbonara
    correct:
      - { text: vajcia alebo žĺtky, why: "Zmiešajú sa so syrom a s horúcimi cestovinami vytvoria krémovú omáčku." }
      - { text: pecorino romano, why: "Ovčí syr je bežný syr pre carbonaru." }
      - { text: guanciale, why: "Sušené bravčové líčko je tradičné mäso, niekedy sa nahrádza pancettou." }
      - { text: čierne korenie, why: "Dáva sa ho poriadne veľa." }
      - { text: špagety, why: "Najčastejšie cestoviny pre carbonaru." }
    wrong:
      - { text: smotana, why: "Väčšina talianskych receptov ju nemá; staršie recepty ju mali, z väčšiny receptov zmizla až v 90. rokoch." }
      - { text: zelený hrášok, why: "Hrášok sa pridáva len vo verziách mimo Talianska." }
      - { text: šampiňóny, why: "Huby pridávajú len verzie mimo Talianska alebo vegetariánske recepty." }
      - { text: šunka, why: "Šunkou nahrádzajú guanciale len mimo Talianska." }
      - { text: brokolica, why: "Zelenina do carbonary sa dáva len v zahraničných verziách." }
      - { text: pór, why: "Patrí medzi zahraničné zeleninové „vylepšenia“." }

  - id: paella-valenciana-suroviny
