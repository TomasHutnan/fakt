      - { text: mrkva, why: "Patrí do koreňovej zeleniny, z ktorej je omáčka." }
      - { text: zeler, why: "Ďalšia koreňová zelenina, rozmixuje sa do omáčky." }
      - { text: petržlen, why: "Koreň petržlenu je tretia klasická koreňová zelenina v omáčke." }
      - { text: smotana, why: "Veď je to sviečková na smotane." }
      - { text: brusnice, why: "Podávajú sa na plátku citróna so šľahačkou." }
