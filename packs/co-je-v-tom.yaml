id: co-je-v-tom
title: Čo je v tom?
description: Z čoho sa varia známe jedlá zo Slovenska aj zo sveta a odkiaľ pochádzajú.
category: tradicie
lang: sk
license: CC0-1.0
adult: false
version: 1
questions:
  - id: bryndzove-halusky-suroviny
    type: pick
    prompt: Čo patrí do klasických bryndzových halušiek?
    difficulty: 1
    source: https://sk.wikipedia.org/wiki/Bryndzové_halušky
    correct:
      - { text: surové zemiaky, why: "Strúhajú sa najemno a sú základom cesta." }
      - { text: múka, why: "Spája nastrúhané zemiaky do cesta." }
      - { text: soľ, why: "Ide do cesta aj do vody, v ktorej sa halušky varia." }
      - { text: bryndza, why: "Bez nej by to boli len halušky; mieša sa s horúcimi haluškami." }
      - { text: slanina, why: "Opražená ide navrch aj s vypraženou masťou." }
    wrong:
      - { text: kyslá kapusta, why: "Halušky s kapustou sú strapačky, iné jedlo." }
      - { text: tvaroh, why: "S tvarohom sa robia skôr sladké pirohy či šúľance, nie bryndzové halušky." }
      - { text: oštiepok, why: "Údený syr sa na halušky nedáva, tam patrí bryndza." }
      - { text: šunka, why: "Navrch ide slanina, nie šunka." }
      - { text: mak, why: "Mak patrí na sladké šúľance alebo bobáľky, nie na halušky." }
      - { text: parmezán, why: "Taliansky syr na cestoviny, do slovenskej klasiky nepatrí." }
      - { text: krupica, why: "Cesto na halušky je z múky a zemiakov, krupica sa dáva do kaše či knedlí." }

  - id: segedinsky-gulas-suroviny
    type: pick
    prompt: Čo sa dáva do klasického segedínskeho guláša?
    difficulty: 2
    source: https://sk.wikipedia.org/wiki/Segedínsky_guláš
    note: "Aj https://cs.wikipedia.org/wiki/Segedínský_guláš"
    correct:
      - { text: bravčové mäso, why: "Segedín sa varí najmä z bravčového, z pleca alebo bôčika." }
      - { text: kyslá kapusta, why: "Hlavná surovina, bez nej to nie je segedín." }
      - { text: cibuľa, why: "Na nej sa kapusta s mäsom dusí." }
      - { text: mletá sladká paprika, why: "Dodá farbu aj chuť, podobne ako pri iných gulášoch." }
      - { text: rasca, why: "Klasické korenie ku kyslej kapuste." }
      - { text: kyslá smotana, why: "Zjemní kyslú kapustu na konci varenia." }
    wrong:
      - { text: sušené hríby, why: "Tie patria do vianočnej kapustnice, nie do segedínu." }
      - { text: sušené slivky, why: "Typické pre kapustnicu, do segedínu sa nedávajú." }
      - { text: ryža, why: "Segedín sa podáva s knedľou alebo chlebom, ryža v ňom nie je." }
      - { text: fazuľa, why: "Fazuľa patrí do fazuľovice, segedín je kapustový." }
      - { text: zelený hrášok, why: "V recepte segedínu sa neobjavuje." }
      - { text: kukurica, why: "Do segedínu nepatrí." }

  - id: svieckova-suroviny
    type: pick
    prompt: Čo patrí do sviečkovej na smotane alebo k nej na tanier?
    difficulty: 1
