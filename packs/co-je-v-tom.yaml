      - { text: piškóty (savoiardi), why: "Podlhovasté piškóty sa namáčajú v káve." }
      - { text: káva, why: "Do nej sa namáčajú piškóty; „tirami su“ znamená „povzbuď ma“." }
      - { text: mascarpone, why: "Krémový taliansky syr je základ krému." }
      - { text: vaječné žĺtky, why: "Šľahajú sa s cukrom do krému." }
      - { text: cukor, why: "Šľahá sa so žĺtkami." }
      - { text: kakao, why: "Posype sa ním vrch." }
    wrong:
      - { text: tvaroh, why: "Tvarohový krém je domáca náhrada, klasika má mascarpone." }
      - { text: ricotta, why: "Taliansky syr, ale do tiramisu patrí mascarpone." }
      - { text: jahody, why: "Ovocné verzie sú variácie, klasika je kávová." }
      - { text: želatína, why: "Krém drží vďaka mascarpone a žĺtkom, nie želatíne." }
      - { text: banány, why: "Ovocie v klasickom recepte nie je." }
