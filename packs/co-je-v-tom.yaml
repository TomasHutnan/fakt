      - { text: guacamole – zelený hrášok, why: "Pravé guacamole je z avokáda, hrášok doň nepatrí." }
      - { text: baba ghanoush – cuketa, why: "Je z baklažánu, nie z cukety." }
      - { text: gazpacho – tekvica, why: "Gazpacho je paradajkové, tekvica do neho nepatrí." }

