id: svet-stereotypy
title: Stereotypy a zlozvyky
description: "Pravda alebo mýtus? Známe predstavy o krajinách a ich zvykoch – čaj, zemiaky, cestoviny, pracovné hodiny, fajčenie – proti číslam z OECD, FAO a WHO."
category: tradicie
lang: sk
license: CC0-1.0
adult: false
version: 2
questions:
  # ================================================================ PICK
  - id: stereo-potvrdene-ciselami
    type: pick
    prompt: "Ktoré z týchto predstáv o krajinách sa v číslach potvrdzujú?"
    difficulty: 1
    tags: [stereotypy, jedlo, údaje]
    asOf: "2022"
    source: "https://en.wikipedia.org/wiki/Pasta https://en.wikipedia.org/wiki/List_of_countries_by_tea_consumption_per_capita https://en.wikipedia.org/wiki/Fallout_shelter https://en.wikipedia.org/wiki/Sauna https://www.fao.org/faostat/en/#data/FBS https://sdmx.oecd.org/public/rest/data/OECD.ELS.SAE,DSD_HW@DF_AVG_ANN_HRS_WKD,1.0/all?startPeriod=2023&endPeriod=2023 https://ghoapi.azureedge.net/api/M_Est_tob_curr"
    correct:
      - { text: "Taliani jedia najviac cestovín na obyvateľa", why: "V roku 2015 to bolo asi 23,5 kg na osobu; druhé bolo prekvapivo Tunisko so 16 kg." }
      - { text: "Argentínčania jedia najviac hovädzieho na obyvateľa", why: "Podľa FAO bolo v roku 2022 v Argentíne k dispozícii okolo 46 kg hovädzieho na osobu, viac než kdekoľvek inde." }
      - { text: "Turci pijú najviac čaju na obyvateľa", why: "Turecko vedie svetový rebríček s odstupom, asi 3,2 kg suchého čaju na osobu ročne (údaje za rok 2016)." }
      - { text: "Švajčiari majú úkryty pre celé obyvateľstvo", why: "Švajčiarsko malo okolo roku 2006 v úkrytoch 8,6 milióna miest, čo je 114 % obyvateľov." }
      - { text: "Vo Fínsku je aspoň jedna sauna na každých troch obyvateľov", why: "Oficiálne registre uvádzajú aspoň 2 milióny sáun pre 5,5 milióna obyvateľov; Fínska saunová spoločnosť odhaduje až 3,2 milióna." }
    wrong:
      - { text: "Nemci pracujú najviac hodín zo všetkých krajín OECD", why: "Naopak: v roku 2023 mali s 1 338 hodinami na pracovníka najmenej v zozname OECD." }
      - { text: "Japonci pracujú ročne viac hodín než Američania", why: "Podľa OECD v roku 2023 asi 1 610 hodín oproti 1 804 hodinám v USA." }
      - { text: "Briti pijú najviac čaju na obyvateľa", why: "Veľká Británia je v zozname z roku 2016 až štvrtá, za Tureckom, Írskom a Azerbajdžanom." }
      - { text: "Íri jedia najviac zemiakov na obyvateľa", why: "Írsko je podľa FAO ďaleko od vrchu rebríčka; vedie Bielorusko so 167 kg na osobu." }
      - { text: "Číňania pijú viac čaju na obyvateľa než Briti", why: "Podľa zoznamu z roku 2016 je to naopak: Briti vypijú na hlavu asi trikrát viac než Číňania." }
      - { text: "Francúzi fajčia najviac v celej Európe", why: "Podľa WHO je francúzsky podiel (28,6 %) vysoký, ale Srbsko (36,5 %) či Bulharsko (35,5 %) sú vyššie." }
      - { text: "Japonci jedia najviac rýb na obyvateľa", why: "Japonsko má asi 45 kg ročne, no Island má 85 kg a Portugalsko 54 kg." }

