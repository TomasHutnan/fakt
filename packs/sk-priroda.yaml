      - text: Santovka
        why: Prameň je pri Dudinciach.
      - text: Salvator
        why: Pramení pri Lipovciach neďaleko Prešova.
      - text: Kláštorná
        why: Z vrtu pri Kláštore pod Znievom.
      - text: Fatra
        why: Minerálka z Turčianskej kotliny.
    wrong:
      - text: Mattoni
        why: Pramení v Kyselke v Česku.
      - text: Vincentka
        why: Je z Luhačovíc na Morave.
      - text: Poděbradka
        why: Z českých Poděbrad.
      - text: Gerolsteiner
        why: Nemecká minerálka z Eifelu.
      - text: Borjomi
        why: Gruzínska minerálka.
      - text: Radenska
        why: Slovinská minerálka.

  - id: pohoria-sk
    type: pick
