    correct:
      - text: Vtáčnik
        why: Pohorie v Hornonitrianskej kotline.
      - text: Tribeč
        why: Leží nad Nitrou.
      - text: Kremnické vrchy
        why: Pohorie pri Kremnici s lyžiarskym strediskom Skalka.
      - text: Slanské vrchy
        why: Sopečné pohorie pri Prešove a Košiciach.
      - text: Poľana
        why: Zhasnutý vulkán nad Zvolenom a Detvou.
      - text: Strážovské vrchy
        why: Pohorie nad stredným Považím.
      - text: Biele Karpaty
        why: Pohorie na hranici s Českom.
      - text: Štiavnické vrchy
        why: Sopečné pohorie s Banskou Štiavnicou.
    wrong:
      - text: Šumava
        why: Je v Česku, pri hraniciach s Nemeckom a Rakúskom.
      - text: Krkonoše
        why: Najvyššie hory Česka s Sněžkou.
      - text: Jeseníky
        why: Pohorie na Morave a v Sliezsku.
      - text: Bieszczady
        why: Poľské pohorie pri slovenskej hranici.
      - text: Mátra
        why: Najvyššie pohorie Maďarska.
      - text: Retezat
        why: Rumunské Karpaty.

  - id: stity-vysoke-tatry
    type: pick
    prompt: Ktoré z týchto vrcholov ležia vo Vysokých Tatrách?
    difficulty: 2
    tags: [hory]
    source: https://sk.wikipedia.org/wiki/Vysoké_Tatry
    correct:
      - text: Gerlachovský štít
        why: Najvyšší vrchol Slovenska, 2 655 m n. m.
      - text: Lomnický štít
        why: Dá sa naň vyviezť lanovkou.
      - text: Ľadový štít
        why: Stojí blízko Lomnického štítu.
      - text: Slavkovský štít
        why: Dominanta nad Starým Smokovcom.
      - text: Kriváň
        why: Symbol Slovenska.
      - text: Rysy
        why: Hraničný vrchol, jeden z najnavštevovanejších tatranských štítov.
      - text: Kežmarský štít
        why: Zdvíha sa nad Zeleným plesom.
    wrong:
      - text: Ďumbier
        why: Najvyšší vrch Nízkych Tatier.
      - text: Chopok
        why: Dominanta Nízkych Tatier.
      - text: Veľký Rozsutec
        why: Malá Fatra.
      - text: Kráľova hoľa
        why: Nízke Tatry.
      - text: Bystrá
        why: Najvyšší vrch Západných Tatier, nie Vysokých.
      - text: Sitno
        why: Dominanta Štiavnických vrchov.

