id: svet-preslapy
title: Slávne prešľapy
description: "Lode, ktoré sa potopili hneď v prístave, sondy zničené chybou v jednotkách, letiská bez lietadiel a výrobky, ktoré nikto nechcel – všetko zdokumentované."
category: historia
lang: sk
license: CC0-1.0
adult: false
version: 4
