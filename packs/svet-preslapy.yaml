  # ---------------------------------------------------------------- PICK
  - id: preslapy-softver
    type: pick
    prompt: "Ktoré z týchto nehôd spôsobila chyba v softvéri alebo v riadiacom programe?"
    difficulty: 2
    tags: [vesmír, technika]
    source: "https://en.wikipedia.org/wiki/Ariane_flight_V88 https://en.wikipedia.org/wiki/Mariner_1 https://en.wikipedia.org/wiki/Schiaparelli_EDM https://en.wikipedia.org/wiki/Hubble_Space_Telescope https://en.wikipedia.org/wiki/Genesis_(spacecraft) https://en.wikipedia.org/wiki/Leaning_Tower_of_Pisa https://en.wikipedia.org/wiki/20_Fenchurch_Street https://en.wikipedia.org/wiki/Lake_Peigneur https://www.npr.org/sections/thetwo-way/2014/05/22/314888843/too-beaucoup-france-s-new-trains-are-wider-than-its-platforms https://en.wikipedia.org/wiki/Ciudad_Real_Central_Airport"
    correct:
      - { text: "Výbuch rakety Ariane 5 pri jej prvom lete (1996)", why: "Prevod 64-bitového čísla na 16-bitové pretiekol v kóde, ktorý prevzali z Ariane 4." }
      - { text: "Zničenie sondy Mariner 1 (1962)", why: "V ručne písanej matematickej špecifikácii navádzania chýbala jediná vodorovná čiarka nad symbolom; Arthur C. Clarke to nazval najdrahším spojovníkom v histórii." }
      - { text: "Pád pristávacieho modulu Schiaparelli na Mars (2016)", why: "Výpočet mu na chvíľu ukázal zápornú výšku, a tak sa správal, akoby už pristál – v skutočnosti bol 3,7 km nad povrchom." }
    wrong:
      - { text: "Rozmazané snímky Hubblovho teleskopu", why: "Zrkadlo vybrúsili presne, ale do zlého tvaru: šošovka v testovacom prístroji bola posunutá o 1,3 mm." }
      - { text: "Neotvorený padák kapsuly Genesis (2004)", why: "Snímač zrýchlenia bol navrhnutý a namontovaný naopak – chyba hardvéru, nie programu." }
      - { text: "Sklon šikmej veže v Pise", why: "Za sklon môže mäkké podložie a základy hlboké len asi tri metre." }
      - { text: "Roztavené časti auta pod londýnskym mrakodrapom Walkie-Talkie", why: "Prehnutá sklenená fasáda sústreďovala slnečné lúče na ulicu." }
      - { text: "Zmiznutie jazera Peigneur v Louisiane (1980)", why: "Vrták ropnej plošiny prerazil strop soľnej bane pod jazerom a voda sa vliala dnu." }
      - { text: "Francúzske vlaky širšie ako nástupištia (2014)", why: "Železnice dostali neúplné rozmery: údaje zahŕňali len nástupištia mladšie ako 30 rokov." }
      - { text: "Krach letiska Ciudad Real v Španielsku", why: "Prevádzkovateľ skrachoval v roku 2012, keď odtiaľ odišla posledná letecká spoločnosť." }

