      - { text: "Naklonila sa po bombardovaní v 2. svetovej vojne", why: "Nakláňala sa už od 12. storočia." }
      - { text: "Po oprave stojí úplne rovno", why: "Sklon zmenšili z 5,5° na 3,97°, nakláňa sa dodnes." }
      - { text: "Sklon spôsobilo zemetrasenie", why: "Za sklon môže mäkké podložie; zemetrasenia naopak prečkala." }
      - { text: "Ako protiváhu k nej pristavili betónový blok", why: "Protiváha bola z olova – 870 ton, uložených od roku 1993." }
      - { text: "Sklon sa dnes rok čo rok zväčšuje", why: "Po prácach v rokoch 1993 – 2001 ju vyhlásili za stabilnú najmenej na 300 rokov." }

