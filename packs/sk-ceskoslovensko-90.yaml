id: sk-ceskoslovensko-90
title: Československo a 90. roky
description: Nežná revolúcia, rozdelenie štátu, večerníčky, koruna, autá a hity deväťdesiatych rokov.
lang: sk
license: CC0-1.0
adult: false
version: 1
questions:
  - id: nezna-revolucia-1989
    type: pick
    prompt: Ktoré z týchto udalostí alebo hnutí priamo patria k Nežnej revolúcii v novembri a decembri 1989?
    difficulty: 1
    source: https://sk.wikipedia.org/wiki/Nežná_revolúcia
    correct:
      - text: Verejnosť proti násiliu (VPN)
        why: Navrhli ju 19. novembra 1989 a formálne vznikla 20. novembra v Bratislave ako hlavné občianske hnutie na Slovensku.
      - text: Občianske fórum (OF)
        why: Založili ho 19. novembra 1989 v pražskom Činohernom klube okolo Václava Havla.
      - text: generálny štrajk 27. novembra
        why: Dvojhodinový štrajk od poludnia sa konal po celom Československu.
      - text: zásah na Národnej triede v Prahe
        why: Tvrdé potlačenie študentského pochodu 17. novembra odštartovalo celú revolúciu.
      - text: zrušenie vedúcej úlohy KSČ v ústave
        why: Federálne zhromaždenie vypustilo článok 4 ústavy 29. novembra 1989.
      - text: zvolenie Václava Havla za prezidenta
        why: Poslanci ho zvolili 29. decembra 1989, deň po zvolení Alexandra Dubčeka za predsedu parlamentu.
    wrong:
      - text: Sviečková manifestácia v Bratislave
        why: Odohrala sa už 25. marca 1988, vyše poldruha roka pred Nežnou revolúciou.
      - text: zverejnenie Charty 77
        why: Občianska iniciatíva vznikla už na prelome rokov 1976 a 1977.
      - text: prvé slobodné parlamentné voľby
        why: Konali sa až 8. a 9. júna 1990.
      - text: vznik Českej a Slovenskej Federatívnej Republiky
        why: Názov ČSFR začal platiť až v apríli 1990 po takzvanej pomlčkovej vojne.
      - text: schválenie Ústavy Slovenskej republiky
        why: Slovenská národná rada ju prijala až 1. septembra 1992.
      - text: kolkovanie československých bankoviek
        why: Prebehlo až v roku 1993 pri rozdelení spoločnej meny.

  - id: rozdelenie-csfr-1993
    type: pick
    prompt: Čo platilo pri rozdelení Česko-Slovenska k 1. januáru 1993 a v prvých mesiacoch samostatnosti?
    difficulty: 2
    source: https://sk.wikipedia.org/wiki/Rozdelenie_Česko-Slovenska
    correct:
      - text: "federálny majetok sa delil najmä v pomere 2 : 1"
        why: Hnuteľný a finančný majetok sa delil približne podľa počtu obyvateľov v prospech Česka.
      - text: spoločná mena prežila štát o necelých šesť týždňov
        why: Menová odluka nastala až 8. februára 1993, dovtedy ešte platila spoločná koruna.
      - text: staré bankovky sa najprv lepili kolkami
        why: Československé bankovky od 20 do 1 000 Kčs dostali slovenský kolok, kým prišli nové.
      - text: Slovensko prijali do OSN ešte v januári 1993
        why: Členským štátom Organizácie Spojených národov sa stalo 19. januára 1993.
      - text: prvým prezidentom SR sa stal Michal Kováč
        why: Zvolil ho parlament vo februári 1993 a do úradu nastúpil 2. marca 1993.
    wrong:
      - text: o rozdelení štátu rozhodli občania v referende
        why: Žiadne referendum sa nekonalo, zánik federácie odhlasovalo Federálne zhromaždenie.
      - text: "koruna slovenská a česká začínali v kurze 2 : 1"
        why: "Pri štarte 8. februára 1993 mali obe meny rovnakú hodnotu 1 : 1."
      - text: kolkovali sa aj všetky halierové mince
        why: Kolky sa lepili iba na papierové bankovky, mince sa nekolkovali.
      - text: Slovensko vstúpilo do NATO hneď v roku 1993
        why: Členom NATO sa stalo až v marci 2004.
      - text: prvého prezidenta SR zvolili občania v priamej voľbe
        why: Michala Kováča volili poslanci, prvá priama voľba prezidenta prišla až v roku 1999.
      - text: slovenská koruna platila presne 10 rokov
        why: V obehu bola takmer 16 rokov, až do konca roka 2008.

  - id: prezidenti-a-premieri-90
    type: pick
    prompt: Ktorí z týchto politikov pôsobili v 90. rokoch (1990 – 1999) ako prezidenti alebo premiéri Česko-Slovenska či Slovenska?
    difficulty: 3
    source: https://sk.wikipedia.org/wiki/Zoznam_predsedov_vlády_Slovenska
    correct:
      - text: Václav Havel
        why: Bol prezidentom ČSFR až do svojej abdikácie v júli 1992.
      - text: Michal Kováč
        why: Prvý prezident samostatného Slovenska v rokoch 1993 až 1998.
      - text: Rudolf Schuster
        why: V máji 1999 vyhral prvú priamu voľbu a stal sa prezidentom SR.
      - text: Vladimír Mečiar
        why: V 90. rokoch stál na čele troch slovenských vlád.
      - text: Ján Čarnogurský
        why: Bol predsedom vlády Slovenska od apríla 1991 do júna 1992.
      - text: Jozef Moravčík
        why: Viedol dočasnú vládu od marca do decembra 1994.
      - text: Mikuláš Dzurinda
        why: Predsedom vlády SR sa stal po voľbách v októbri 1998.
    wrong:
      - text: Alexander Dubček
        why: Po roku 1989 bol predsedom Federálneho zhromaždenia, nie prezidentom ani premiérom.
      - text: Ivan Gašparovič
        why: V 90. rokoch pôsobil vo vrcholnej politike ako poslanec a predseda parlamentu, prezidentom sa stal až v roku 2004.
      - text: Robert Fico
        why: Prvýkrát sa stal premiérom až po voľbách v roku 2006.
      - text: František Mikloško
        why: Bol predsedom Slovenskej národnej rady, nie predsedom vlády.
      - text: Pavol Hrušovský
        why: Viedol Národnú radu SR, premiérom ani prezidentom nebol.
      - text: Ján Slota
        why: V 90. rokoch pôsobil ako poslanec a primátor Žiliny, nie ako premiér.

  - id: animovane-postavicky-cs
