    correct:
      - text: knieža Pribina
        why: Zdobilo najmenšiu 20-korunovú bankovku spolu s Nitrianskym hradom.
      - text: svätí Cyril a Metod
        why: Vierozvestci boli na 50-korunáčke spolu s dražovským kostolíkom.
      - text: Madona z oltára Majstra Pavla v Levoči
        why: Na 100-korunáčke bola spolu s motívom Levoče.
      - text: Anton Bernolák
        why: Prvý kodifikátor spisovnej slovenčiny patril na 200-korunovú bankovku s Trnavou.
      - text: Ľudovít Štúr
        why: Jeho portrét bol na 500-korunáčke spolu s Bratislavským hradom.
      - text: Andrej Hlinka
        why: Zdobil 1000-korunovú bankovku.
      - text: Milan Rastislav Štefánik
        why: Bol na najvyššej 5000-korunovej bankovke spolu s mohylou na Bradle.
    wrong:
      - text: Pavol Országh Hviezdoslav
        why: Bol na československej 10-korunáčke z roku 1986, na slovenských bankovkách nie.
      - text: Jan Amos Komenský
        why: Objavil sa na československej 20-korunáčke a českej dvestokorunáčke, nie na slovenskej.
      - text: Juraj Jánošík
        why: Zbojník na žiadnej obehovej bankovke slovenskej koruny nebol.
      - text: Tomáš Garrigue Masaryk
        why: Prvý československý prezident je na českej 5000-korunáčke, nie na slovenskej.
      - text: Božena Němcová
        why: Spisovateľka bola motívom českej 500-korunáčky, nie slovenskej meny.
      - text: Alexander Dubček
        why: Hoci je významnou osobnosťou dejín, na slovenskej korunovej bankovke nebol.

