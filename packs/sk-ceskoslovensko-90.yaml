      - text: Krtko
        why: Svetoznámu postavičku vytvoril Zdeněk Miler už v roku 1957.
      - text: Pat a Mat
        why: Dvoch nešikovných kutilov vymysleli Lubomír Beneš a Vladimír Jiránek.
      - text: Bob a Bobek
        why: Králiky z klobúka, seriál pre Večerníček z roku 1979.
      - text: Maxipes Fík
        why: Seriál z roku 1976 o obrovskom psovi a dievčatku Áji.
      - text: Maťko a Kubko
        why: Slovenský seriál Pásli ovce valasi z roku 1972 rozprával Jozef Kroner.
      - text: Jurošík
        why: Slovenský seriál o dobrom zbojníkovi z roku 1991 rozprával Stano Dančiak.
      - text: Křemílek a Vochomůrka
        why: Lesní škriatkovia z českého večerníčka, rozprávala Jiřina Bohdalová.
    wrong:
      - text: Bolek a Lolek
        why: Obľúbený seriál o dvoch bratoch vznikol v Poľsku.
      - text: Včielka Maja
        why: Animovaný seriál z roku 1975 vznikol v japonsko-nemeckej produkcii.
      - text: No, počkaj!
        why: Naháňačky Vlka a Zajaca vznikli v Sovietskom zväze.
      - text: Šmolkovia
        why: Modré postavičky vymyslel Belgičan Peyo a seriál produkovali v USA.
      - text: Máša a medveď
