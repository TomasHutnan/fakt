        why: Tiež celé kolo, veterný limit sa naň nevzťahuje.
      - text: beh na 800 m
        why: Vietor sa tu pri rekordoch nemeria.
      - text: skok do výšky
        why: Veterný limit pre výšku nie je.
      - text: skok o žrdi
        why: Hoci sa beží rozbeh, veterný limit pre žrď neplatí.
      - text: hod oštepom
        why: Hody veterný limit nemajú.
      - text: hod diskom
        why: Disk vietor oproti dokonca nesie ďalej, no limit tu neplatí.
      - text: vrh guľou
        why: 7,26 kg vietor veľmi nepostrčí.

