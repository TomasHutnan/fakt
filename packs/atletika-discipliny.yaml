id: atletika-discipliny
title: "Atletika: disciplíny a pravidlá"
description: Desaťboj, prekážky, chybné štarty, náčinie, kvalifikačné limity, Diamantová liga a prémie – kráľovná športov od preťahovania lanom po Budapešť.
lang: sk
version: 1
questions:
  # ---------------------------------------------------------------- PICK
  - id: olympijske-discipliny-historicke
    type: pick
    prompt: Ktoré z týchto disciplín boli niekedy súčasťou olympijskej atletiky?
    difficulty: 1
    source: https://en.wikipedia.org/wiki/Athletics_at_the_Summer_Olympics
    tags: [olympiáda, história]
    correct:
      - text: preťahovanie lanom
        why: V rokoch 1900–1920 sa počítalo do olympijskej atletiky, dnes ho za atletiku nikto nepovažuje.
      - text: skok do výšky z miesta
        why: Bez rozbehu, z oboch nôh; na hrách bol od roku 1900 do 1912.
      - text: skok do diaľky z miesta
        why: Ďalší skok bez rozbehu, ktorý z programu zmizol po hrách 1912.
      - text: trojskok z miesta
        why: Len dvakrát, v Paríži 1900 a v St. Louis 1904.
      - text: beh na 200 m cez prekážky
        why: Nízke prekážky, olympijský len v rokoch 1900 a 1904.
      - text: hod 56-librovým závažím
        why: Takmer 25,4 kg železa, hádzalo sa v rokoch 1904 a 1920.
      - text: beh na 60 m
        why: Dnes len halová disciplína, no na hrách 1900 a 1904 sa bežal vonku.
      - text: vrh guľou obojručne
        why: Raz, v Štokholme 1912; výsledok bol súčet pokusov pravou a ľavou rukou.
      - text: hod oštepom voľným štýlom
        why: Len v Londýne 1908, oštep sa mohol chytiť kdekoľvek.
      - text: cezpoľný beh
        why: Na hrách 1912, 1920 a 1924, potom zmizol a odvtedy sa nevrátil.
    wrong:
      - text: hod kladivom obojručne
        why: Obojručne sa v roku 1912 vrhala guľa, hádzal disk a oštep, kladivo nie.
      - text: beh na 100 yardov
        why: Olympijské šprinty sa merali v metroch; yardy vo výpočte olympijských disciplín nie sú.
      - text: chôdza na 100 km
        why: Najdlhšia olympijská chôdza mala 50 km.
      - text: štafeta 4 × 200 m
        why: Na hrách boli štafety 4 × 100, 4 × 400 a raz kombinovaná štafeta (1908), nie 4 × 200.
      - text: skok o žrdi z miesta
        why: Skákalo sa z miesta do výšky, do diaľky aj trojskokom, ale o žrdi vždy s rozbehom.
      - text: hod kriketovou loptičkou
        why: Na olympiáde nikdy nebol; z exotických hodov sa skúšal disk po grécky a obojručné hody.
      - text: beh na 1 míľu
        why: Míľa na hrách nebola; bežalo sa 5 míľ (1908) a tímové behy na 3 a 4 míle.

