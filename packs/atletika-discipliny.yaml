  - id: pravidla-behy
    type: pick
    prompt: Ktoré tvrdenia o pravidlách bežeckých disciplín sú pravdivé?
    difficulty: 1
    source: https://en.wikipedia.org/wiki/False_start
    tags: [pravidlá, beh]
    correct:
      - text: Na olympiáde vylučuje šprintéra už prvý chybný štart
        why: Na to doplatil aj Usain Bolt vo finále stovky na MS 2011 v Tegu.
      - text: Pohyb skôr ako 0,1 s po výstrele sa počíta ako chybný štart
        why: Rýchlejšie podľa pravidiel človek na výstrel zareagovať nevie.
      - text: Prekážkar, ktorý nechtiac zhodí prekážku, nie je diskvalifikovaný
        why: Zhodenie prekážky stojí len čas, nie diskvalifikáciu.
      - text: Na prekážku v behu na 3000 m prekážok sa smie stúpiť
        why: Prekážky sú pevné, nepadajú a pravidlá dovoľujú prekonať ich akýmkoľvek spôsobom.
      - text: Odovzdávkové územie v štafete 4 × 100 m má 30 m
        why: Od novembra 2017; predtým 20 m plus 10 m na rozbeh.
      - text: Pád kolíka sám osebe neznamená diskvalifikáciu štafety
        why: Stojí veľa času, ale sám osebe štafetu nevylúči.
      - text: Bežci na 800 m sa po prvej zákrute zbiehajú do jednej dráhy
        why: Je to najkratší beh, v ktorom sa bežci stretnú pri vnútornom okraji.
      - text: Rekord na 100 m neplatí, ak fúka vietor v chrbát nad 2,0 m/s
        why: Preto Tyson Gay 9,68 s pri vetre 4,1 m/s nie je rekord.
    wrong:
      - text: Za prvý chybný štart dostane šprintér na olympiáde len varovanie
        why: Tolerancia skončila; už prvý chybný štart znamená vylúčenie.
      - text: Kto zhodí tri prekážky, je diskvalifikovaný
        why: Nechtiac zhodených prekážok môže byť koľkokoľvek, trestá sa len úmysel.
      - text: Prekážky v behu na 3000 m prekážok sa musia preskočiť bez dotyku
        why: Mnohí bežci na prekážku normálne stúpia, najmä pri vodnej priekope.
      - text: Odovzdávkové územie v štafete 4 × 100 m má 20 m
        why: Tak to bolo do roku 2017, dnes má 30 m.
      - text: Ak bežcovi spadne kolík, štafeta je automaticky vylúčená
        why: Pád kolíka sa netrestá, len stojí veľa času.
      - text: Rekord na 400 m neplatí pri vetre v chrbát nad 2,0 m/s
        why: Veterný limit platí len pre 100 m, 200 m, krátke prekážky, diaľku a trojskok.
      - text: Beh na 800 m sa beží celý v dráhach
        why: V dráhach je len do konca prvej zákruty.
      - text: Vodná priekopa v behu na 3000 m prekážok je hlboká vyše metra
        why: Najhlbšia je hneď za prekážkou, asi 70 cm, a smerom dopredu sa zvažuje.

  - id: pravidla-technicke
    type: pick
    prompt: Ktoré tvrdenia o pravidlách skokov a hodov sú pravdivé?
    difficulty: 2
    source: https://en.wikipedia.org/wiki/High_jump
    tags: [pravidlá, skoky, hody]
    correct:
      - text: Výškar vypadne po troch neúspešných pokusoch za sebou
        why: Pokusy sa počítajú za sebou, aj keď sú na rôznych výškach.
      - text: Výškar smie niektorú výšku vynechať
        why: Vynechanie šetrí sily, ale riskuje, že na vyššej laťke neuspeje.
      - text: Pri rovnosti na prvom mieste vo výške si skokani môžu zlato podeliť
        why: Pravidlo z roku 2009; v Tokiu 2020 si tak zlato rozdelili Barshim a Tamberi.
      - text: Vo finále hodov dostane po troch sériách najlepších osem ďalšie tri pokusy
        why: Ostatní finalisti po tretej sérii končia.
      - text: Guľa sa musí vrhať jednou rukou
        why: Vypúšťa sa jednou rukou nad úrovňou ramena; obojručne sa vrhalo len na hrách 1912.
      - text: Mužská guľa a mužské kladivo vážia rovnako
        why: Oboje 7,26 kg, teda 16 libier.
      - text: Skok do diaľky sa meria k najbližšej stope v piesku
        why: Kto si sadne dozadu, prichádza o centimetre.
      - text: Výsek pre vrh guľou má necelých 35 stupňov
        why: Presne 34,92°; od roku 2004 ho kvôli bezpečnosti zúžili zo 40°.
    wrong:
      - text: Výškar vypadne, len ak trikrát neprekoná tú istú výšku
        why: Stačia tri neúspechy za sebou na akýchkoľvek výškach.
      - text: Pri rovnosti vo výške musí o víťazovi vždy rozhodnúť rozoskakovanie
        why: Od roku 2009 je rozoskakovanie dobrovoľné.
      - text: Od roku 2026 sa skok do diaľky skáče zo 40-centimetrovej odrazovej zóny
        why: Zónu skúšali, no v decembri 2025 od reformy upustili.
      - text: Guľu možno vrhať obojručne, ak to pretekár vopred ohlási
        why: Obojručný vrh bol olympijský len v roku 1912.
      - text: Ženské kladivo váži rovnako ako mužské
        why: Ženské má 4 kg, mužské 7,26 kg.
      - text: Každý finalista vo vrhu guľou má šesť pokusov
        why: Štvrtý až šiesty pokus dostane len najlepších osem.
      - text: Rekord v hode oštepom neplatí pri vetre v chrbát nad 2,0 m/s
        why: Veterný limit platí len pre šprinty, krátke prekážky, diaľku a trojskok.
      - text: Diaľka sa meria od miesta, kde sa skokan skutočne odrazil
        why: Meria sa od čiary brvna, takže každý centimeter pred ňou je stratený.

