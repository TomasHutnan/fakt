      - { text: ä, why: "Tretie písmeno abecedy, hovorovo „široké e“." }
      - { text: ô, why: "Číta sa [uo] a v abecede je 29. v poradí." }
      - { text: ĺ, why: "Dlhé el, spolu s ŕ sú jediné spoluhlásky s dĺžňom." }
      - { text: ŕ, why: "Dlhé er, slabikotvorné r." }
