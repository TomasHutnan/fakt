      - text: Paríž
        why: V rokoch 1900, 1924 a 2024; storočnica tých druhých hier.
      - text: Los Angeles
        why: V rokoch 1932 a 1984, v roku 2028 bude hostiť tretíkrát.
      - text: Atény
        why: Prvé novodobé hry v roku 1896 a potom v roku 2004.
      - text: Tokio
        why: V rokoch 1964 a 2020, ako prvé ázijské mesto dvakrát.
    wrong:
      - text: Peking
        why: Letnú olympiádu mal raz (2008), no v roku 2022 aj zimnú – ako prvé mesto oboje.
      - text: Berlín
        why: Len raz, v roku 1936.
      - text: Rím
        why: Len raz, v roku 1960; v tom istom roku tam boli aj prvé paralympijské hry.
      - text: Mníchov
        why: Len raz, v roku 1972.
      - text: Moskva
        why: Len raz, v roku 1980.
      - text: Helsinki
        why: Hostili v roku 1952; hry v roku 1940, presunuté z Tokia, sa pre vojnu nekonali.
      - text: Sydney
        why: Len raz, v roku 2000; Austrália mala aj Melbourne 1956 a v roku 2032 bude mať Brisbane.

