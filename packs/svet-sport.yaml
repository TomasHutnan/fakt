  # ---------------------------------------------------------------- PICK
  - id: triatlon-fakty
    type: pick
    prompt: Ktoré tvrdenia o triatlone sú pravdivé?
    difficulty: 2
    source: https://en.wikipedia.org/wiki/Triathlon
    note: "Ďalší zdroj: en.wikipedia.org/wiki/Ironman_Triathlon"
    tags: [triatlon, pravidlá]
    correct:
      - text: Olympijský triatlon tvorí 1,5 km plávania, 40 km na bicykli a 10 km behu
        why: Tejto vzdialenosti sa hovorí olympijská alebo štandardná.
      - text: Na olympiáde je triatlon od Sydney 2000
        why: Do programu ho zaradili v septembri 1994, šesť rokov pred debutom.
      - text: V Ironmane sa pláva 3,86 km
        why: Pôvodne 2,4 míle; „Swim 2.4 miles!“ stálo v prvých pravidlách z Havaja.
      - text: V Ironmane sa na bicykli jazdí vyše 180 km
        why: Presne 180,2 km, teda 112 míľ.
      - text: Ironman končí celým maratónom
        why: 42,195 km behu po plávaní a 180 km na bicykli.
      - text: Prvý Ironman sa konal v roku 1978 na Havaji
        why: Na štart sa postavilo 15 mužov, do cieľa ich došlo 12.
      - text: Šprintový triatlon má polovičné vzdialenosti olympijského
        why: 750 m plávania, 20 km na bicykli a 5 km behu.
      - text: Na väčšinu Ironmanov má pretekár limit 16 až 17 hodín
        why: Štart býva o 7:00, takže posledným pretekárom tlieskajú okolo polnoci.
    wrong:
      - text: Triatlon sa začína behom a končí plávaním
        why: Poradie je plávanie, bicykel a beh.
      - text: V olympijskom triatlone sa pláva 3,8 km
        why: To je Ironman; olympijská trať má 1,5 km.
      - text: Na olympiáde je triatlon od Atlanty 1996
        why: Debutoval až o štyri roky neskôr v Sydney.
      - text: Ironman končí polmaratónom
        why: Polmaratón je v polovičnom Ironmane 70.3, plný Ironman končí maratónom.
      - text: V olympijskom triatlone sa na bicykli jazdí 90 km
        why: Jazdí sa 40 km; 90 km má polovičný Ironman.

  - id: moderny-patboj
    type: pick
    prompt: Z ktorých piatich disciplín sa skladal moderný päťboj až po olympiádu v Paríži 2024?
    difficulty: 2
    source: https://www.uipmworld.org/sport/uipm-modern-pentathlon
    note: "Ďalšie zdroje: en.wikipedia.org/wiki/Modern_pentathlon, en.wikipedia.org/wiki/Modern_pentathlon_at_the_2024_Summer_Olympics"
    tags: [päťboj, olympiáda]
    correct:
      - text: šerm kordom
        why: Bojuje sa na jeden zásah, kto trafí prvý, vyhráva.
      - text: plávanie voľným spôsobom
        why: V Paríži 2024 sa plávalo 200 m.
      - text: jazda na vylosovanom koni
        why: Jazdec dostal neznámeho koňa; od roku 2025 jazdu nahradila prekážková dráha.
      - text: streľba z pištole
        why: Od roku 2011 sa strieľa laserovou pištoľou, spolu s behom tvorí záverečný laser-run.
      - text: beh
        why: Kto dobehne v laser-rune prvý, vyhral celý päťboj.
    wrong:
      - text: prekážková dráha
        why: Jazdu na koni nahradila až od roku 2025, na olympiáde debutuje v Los Angeles 2028.
      - text: lukostreľba
        why: Strieľa sa z pištole, nie z luku.
      - text: cyklistika
        why: Bicykel patrí do triatlonu, nie do päťboja.
      - text: hod oštepom
        why: Ten patril do antického päťboja, nie do moderného.
      - text: zápasenie
        why: Aj zápasenie bolo súčasťou antického päťboja spolu s behom, skokom, diskom a oštepom.

  - id: loh-hostitelia-viackrat
