    prompt: Kto namaľoval Salvator Mundi, obraz, ktorý sa v roku 2017 predal za 450,3 milióna dolárov?
    difficulty: 1
    tags: [aukcie, umenie]
    source: "https://www.npr.org/sections/thetwo-way/2017/11/16/564527819/da-vinci-portrait-of-christ-sells-for-record-shattering-450-million"
    correct: { text: Leonardo da Vinci, why: "Je to jeden z posledných známych Leonardových obrazov v súkromných rukách." }
    wrong:
      - { text: Michelangelo, why: "Slávny súčasník, ale autor je iný." }
      - { text: Rembrandt, why: "Holandský majster o storočie neskôr." }
      - { text: Raffael, why: "Aj on tvoril v renesancii, ale autorom nie je." }

  - id: ba-bear-stearns
    type: choice
    prompt: Ktorú investičnú banku na jar 2008 prevzala JPMorgan Chase s pomocou Federálneho rezervného systému?
    difficulty: 2
    tags: [krízy, banky]
    source: "https://www.federalreservehistory.org/essays/great-recession-and-its-aftermath"
    correct: { text: Bear Stearns, why: "Predaná v núdzi na jar 2008, pred pádom Lehmanu." }
    wrong:
      - { text: Lehman Brothers, why: "Vyhlásila bankrot v septembri 2008; nikto ju nezachránil." }
      - { text: Goldman Sachs, why: "Prežila ako samostatná firma." }
      - { text: Citigroup, why: "Mala štátnu pomoc, ale nikto ju neprevzal." }

  - id: ba-cierny-utorok
    type: choice
    prompt: Ako sa nazýva 29. október 1929, deň, keď Dow Jones klesol o takmer 12 percent?
    difficulty: 1
    tags: [krachy]
    source: "https://www.federalreservehistory.org/essays/stock-market-crash-of-1929"
    correct: { text: Čierny utorok, why: "Deň predtým (28. októbra) bol Čierny pondelok, keď Dow klesol takmer o 13 percent." }
    wrong:
      - { text: Čierny pondelok, why: "Tak sa volá 28. október 1929, ale aj 19. október 1987." }
      - { text: Čierny piatok, why: "Tak sa volajú iné udalosti, nie krach z 29. októbra." }
      - { text: Čierna streda, why: "Tak sa nazýva iný deň z histórie trhov." }

  - id: ba-circuit-breakers
    type: choice
    prompt: Čo burzy v USA zaviedli po krachoch z roku 1987 a 1989, aby zastavili paniku pri veľkých poklesoch?
    difficulty: 2
    tags: [krachy]
    source: "https://www.federalreservehistory.org/essays/stock-market-crash-of-1987"
    correct: { text: Prerušenie obchodovania pri veľkom poklese (circuit breakers), why: "Burza obchodovanie dočasne zastaví, aby mali investori čas vychladnúť." }
    wrong:
      - { text: Zákaz predaja akcií na celý týždeň, why: "Také pravidlo neexistuje; ide o krátke pauzy podľa veľkosti poklesu." }
      - { text: Povinné ranné zvonenie pre všetkých obchodníkov, why: "Zvon sa používa len na otvorenie a zatvorenie, nie ako poistka." }
      - { text: Zrušenie všetkých príkazov z predošlého dňa, why: "Príkazy sa tak nerušia." }
