  - id: mosty-cez-dunaj-bratislava
    type: pick
    prompt: Ktoré z týchto mostov v Bratislave vedú cez Dunaj?
    difficulty: 1
    asOf: "2026-11"
    tags: [Bratislava, mosty, Dunaj]
    source: https://sk.wikipedia.org/wiki/Zoznam_mostov_v_Bratislave
    correct:
      - text: Most SNP
        why: Zavesený most z roku 1972 je jediný bratislavský most bez piliera v prúde Dunaja.
      - text: Starý most
        why: Pôvodný Most Františka Jozefa z roku 1890, dnes prestavaný pre električky, chodcov a cyklistov.
      - text: Most Apollo
        why: Otvorili ho v roku 2005; oceľovú konštrukciu zmontovanú na brehu otočili cez rieku.
      - text: Prístavný most
        why: Dvojposchodový most nesie diaľnicu D1 a železničnú trať.
      - text: Most Lanfranconi
        why: Diaľničný most na D2, otvorený v roku 1992; názov sa dlho písal ako Lafranconi.
      - text: Lužný most
        why: Diaľničný most na obchvate D4 otvorili 26. septembra 2021.
    wrong:
      - text: Cyklomost slobody
        why: Vedie cez rieku Moravu do Rakúska.
      - text: Most Márie Valérie
        why: Preklenuje Dunaj, ale spája Štúrovo s maďarským Ostrihomom.
      - text: Alžbetin most
        why: Spája Komárno s maďarským Komáromom, nie Bratislavu.
      - text: Medveďovský most
        why: Je pri obci Medveďov na južnom Slovensku.
      - text: Kolonádový most
        why: Stojí v Piešťanoch a vedie cez Váh.

