  - id: mesta-trolejbusy
    type: pick
    prompt: V ktorých z týchto slovenských miest premávajú trolejbusy mestskej hromadnej dopravy?
    difficulty: 1
    asOf: "2026-11"
    tags: [MHD, trolejbusy]
    source: https://sk.wikipedia.org/wiki/Trolejbusová_doprava_v_Prešove
    correct:
      - text: Bratislava
        why: Najviac trolejbusov na Slovensku jazdí práve v hlavnom meste.
      - text: Prešov
        why: Prešovský trolejbusový systém z roku 1962 je druhý najstarší na Slovensku.
      - text: Žilina
        why: Trolejbusy tu jazdia od roku 1994, je to najmladšia sieť u nás.
      - text: Banská Bystrica
        why: Trolejbusy jazdia na viacerých linkách, napríklad 1, 2, 4, 6, 7 a 8.
    wrong:
      - text: Trnava
        why: Mestskú dopravu zabezpečujú autobusy, trolejbusy tu nejazdia.
      - text: Nitra
        why: Nitrianska MHD je autobusová, trolejbusy tu nejazdia.
      - text: Trenčín
        why: V meste jazdia len autobusy.
      - text: Martin
        why: Martinská MHD je autobusová.
      - text: Poprad
        why: V meste jazdia autobusy MHD, trolejbusy nie.
      - text: Zvolen
        why: Trolejbusy tu nejazdia, mestskú dopravu zabezpečujú autobusy.
      - text: Prievidza
        why: Miestnu MHD zabezpečujú autobusy.

