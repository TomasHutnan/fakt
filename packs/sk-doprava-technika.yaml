  - id: vynalezy-slovensko
    type: pick
    prompt: Ktoré z týchto technických vynálezov alebo strojov vytvorili vynálezcovia zo Slovenska (alebo pôsobiaci na dnešnom Slovensku)?
    difficulty: 2
    tags: [vynálezy, história]
    source: https://sk.wikipedia.org/wiki/Štefan_Banič
    correct:
      - text: letecký padák
        why: Rodák zo Smoleníc Štefan Banič získal na padák americký patent v roku 1914.
      - text: motorový vrtuľník
        why: Ján Bahýľ zo Zvolenskej Slatiny získal v roku 1895 patent na vrtuľník s benzínovým motorom.
      - text: bezdrôtová telegrafia
        why: Kňaz Jozef Murgaš z Tajova získal v USA v roku 1904 dva patenty na bezdrôtovú telegrafiu.
      - text: teória parných a plynových turbín
        why: Liptovskomikulášsky rodák Aurel Stodola, profesor v Zürichu, je zakladateľom tejto teórie.
      - text: šachový automat Turek
        why: Bratislavčan Wolfgang Kempelen ním ohúril Európu, no šachy hral skrytý človek.
      - text: banský vodostĺpcový čerpací stroj
        why: Jozef Karol Hell ho postavil v roku 1749 v banskoštiavnických baniach.
      - text: lietajúce auto AirCar
        why: Slovenský konštruktér Štefan Klein získal v januári 2022 osvedčenie letovej spôsobilosti od slovenského Dopravného úradu.
    wrong:
      - text: lodná skrutka
        why: Patent z roku 1827 si podal Josef Ressel, český lesník a vynálezca.
      - text: mäkké kontaktné šošovky
        why: Vynašiel ich český chemik Otto Wichterle v 50. a 60. rokoch 20. storočia.
      - text: dynamit
        why: Patentoval ho v roku 1867 švédsky chemik Alfred Nobel.
      - text: parný rušeň
        why: Prvý fungujúci rušeň na koľajniciach postavil v roku 1804 Brit Richard Trevithick.

