      - text: Oravská lesná železnica
        why: Turistická úzkorozchodná dráha v oravských lesoch.
      - text: Trenčianska elektrická železnica
        why: Úzkorozchodná električka z Trenčianskej Teplej do Trenčianskych Teplíc.
    wrong:
