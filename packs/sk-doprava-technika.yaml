  - id: vw-bratislava-modely
    type: pick
    prompt: Ktoré z týchto áut sa sériovo vyrábali alebo vyrábajú v bratislavskom závode Volkswagen Slovakia?
    difficulty: 1
    asOf: "2026-11"
    tags: [autá, Bratislava]
    source: https://sk.wikipedia.org/wiki/Volkswagen_Slovakia
    correct:
      - text: Volkswagen Touareg
        why: V Bratislave sa vyrába od roku 2002.
      - text: Porsche Cayenne
        why: Aj toto luxusné SUV schádza z bratislavských liniek od roku 2002.
      - text: Audi Q7
        why: Prvé Audi v Bratislave, výroba sa rozbehla v roku 2006.
      - text: Audi Q8
        why: Do bratislavského portfólia pribudlo v roku 2017.
      - text: Škoda Superb
        why: Superb Combi aj sedan sa dnes vyrábajú v Bratislave.
      - text: Volkswagen Passat
        why: Passat Variant bol v Bratislave už od roku 1992.
      - text: "Volkswagen up!"
        why: Mestské miniauto sa tu vyrábalo od roku 2011 do konca roka 2023.
      - text: Volkswagen Golf
        why: Golf patril k modelom, ktoré závod vyrábal po Passate v 90. rokoch.
    wrong:
      - text: Volkswagen Tiguan
        why: Nie je medzi modelmi, ktoré článok o závode uvádza.
      - text: Audi A4
        why: Z Audi sa v Bratislave vyrábajú Q7 a Q8, A4 medzi modelmi závodu nie je.
      - text: Porsche 911
        why: Z Porsche sa v Bratislave vyrába Cayenne, 911 medzi modelmi závodu nie je.
      - text: Volkswagen Transporter
        why: Nie je medzi modelmi, ktoré článok o závode uvádza.

