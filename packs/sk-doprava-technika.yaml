  - id: technika-pred-2000
    type: pick
    prompt: Ktoré z týchto známych technológií alebo služieb sa objavili ešte pred rokom 2000?
    difficulty: 1
    tags: [technika, história]
    source: https://en.wikipedia.org/wiki/SMS
    correct:
      - text: prvá SMS správa
        why: Neil Papworth ju poslal 3. decembra 1992 s textom Merry Christmas.
      - text: formát MP3
        why: Vznikol začiatkom 90. rokov, príponu .mp3 zvolili 14. júla 1995.
      - text: disk DVD
        why: Philips a Sony ho predstavili v januári 1995, v Japonsku vyšiel 1. novembra 1996.
      - text: štandard Wi-Fi
        why: Prvá verzia protokolu 802.11 vyšla v roku 1997, názov Wi-Fi sa používa od roku 1999.
      - text: technológia Bluetooth
        why: Hlavný vývoj sa začal v roku 1994, verzia 1.0 vyšla v roku 1999.
      - text: Internet Explorer
        why: Prvá verzia vyšla 24. augusta 1995.
      - text: vyhľadávač Google
        why: Larry Page a Sergey Brin založili Google 4. septembra 1998.
      - text: prvý PlayStation
        why: V Japonsku vyšiel 3. decembra 1994.
    wrong:
      - text: Wikipédia
        why: Spustili ju 15. januára 2001.
      - text: Facebook
        why: Mark Zuckerberg ho spustil 4. februára 2004 na Harvarde ako TheFacebook.
      - text: YouTube
        why: Vznikol vo februári 2005, prvé video pribudlo 23. apríla 2005.
      - text: prvý iPhone
        why: Steve Jobs ho predstavil 9. januára 2007.
      - text: Spotify
        why: Spustili ho 7. októbra 2008.
      - text: operačný systém Android
        why: Prvé komerčné vydanie Android 1.0 prišlo 23. septembra 2008.
      - text: ChatGPT
        why: Vyšiel 30. novembra 2022.

  - id: stavby-pred-1918
    type: pick
    prompt: Ktoré z týchto dopravných stavieb na Slovensku vznikli už pred rokom 1918 (za čias Rakúsko-Uhorska)?
    difficulty: 2
    tags: [doprava, história]
    source: https://sk.wikipedia.org/wiki/Konská_železnica
    correct:
      - text: bratislavská konská železnica
        why: Prvá konská železnica na Slovensku (Bratislava – Svätý Jur) začala jazdiť v roku 1840.
      - text: Starý most v Bratislave
        why: Pôvodný Most Františka Jozefa otvorili v roku 1890.
      - text: Košicko-bohumínska železnica
        why: Celú trať dokončili v roku 1872.
      - text: ozubnicová železnica na Štrbské Pleso
        why: Otvorili ju v roku 1896.
      - text: Tatranská elektrická železnica
        why: Prvý úsek otvorili v decembri 1908.
      - text: Most Márie Valérie v Štúrove
        why: Most medzi Štúrovom a Ostrihomom dokončili v roku 1895.
    wrong:
      - text: Most SNP v Bratislave
        why: Otvorili ho až 26. augusta 1972.
      - text: Prístavný most v Bratislave
        why: Stavali sa 1977 – 1985.
      - text: Most Apollo v Bratislave
        why: Otvorili ho v roku 2005.
      - text: Lužný most v Bratislave
        why: Otvorili ho v roku 2021.
      - text: Tunel Višňové
        why: Do užívania ho odovzdali v decembri 2025.

