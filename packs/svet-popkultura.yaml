questions:
  - id: filmy-spielberg
    type: pick
    prompt: Ktoré z týchto filmov režíroval Steven Spielberg?
    difficulty: 1
    source: https://sk.wikipedia.org/wiki/Steven_Spielberg
    correct:
      - text: Čeľuste
        why: Film z roku 1975 je v zozname Spielbergových réžií.
      - text: Indiana Jones a dobyvatelia stratenej archy
        why: Film z roku 1981 je v zozname Spielbergových réžií.
      - text: E.T. Mimozemšťan
        why: Film z roku 1982 je v zozname Spielbergových réžií.
      - text: Jurský park
        why: Film z roku 1993 je v zozname Spielbergových réžií.
      - text: Schindlerov zoznam
        why: Film z roku 1993, za ktorý Spielberg získal Oscara za réžiu.
      - text: Zachráňte vojaka Ryana
        why: Film z roku 1998, za ktorý Spielberg získal druhého Oscara za réžiu.
      - text: Chyť ma, ak to dokážeš
        why: Film z roku 2002 je v zozname Spielbergových réžií.
    wrong:
      - text: Návrat do budúcnosti
        why: Režíroval Robert Zemeckis; Spielberg bol pri filme iba výkonným producentom.
      - text: Forrest Gump
        why: Film z roku 1994 režíroval Robert Zemeckis.
      - text: Terminátor
        why: Film z roku 1984 režíroval James Cameron.
      - text: Titanic
        why: Film z roku 1997 režíroval James Cameron.
      - text: Gladiátor
        why: Film z roku 2000 režíroval Ridley Scott.
      - text: "Pán prsteňov: Spoločenstvo prsteňa"
        why: Film z roku 2001 režíroval Peter Jackson.
      - text: Votrelci
        why: Film z roku 1986 režíroval James Cameron.

  - id: tarantino-filmy
    type: pick
    prompt: Ktoré z týchto filmov režíroval Quentin Tarantino?
    difficulty: 2
    source: https://en.wikipedia.org/wiki/Quentin_Tarantino_filmography
    correct:
      - text: Gauneri (Reservoir Dogs)
        why: Tarantinov režisérsky debut z januára 1992.
      - text: "Pulp Fiction: Historky z podsvetia"
        why: Film z roku 1994 získal Zlatú palmu v Cannes a Oscara za pôvodný scenár.
      - text: Jackie Brownová
        why: Film z roku 1997 podľa románu Rum Punch od Elmorea Leonarda.
      - text: Kill Bill
        why: Vyšiel ako dva filmy, Kill Bill 1 v roku 2003 a Kill Bill 2 v roku 2004.
      - text: Nehanební bastardi
        why: Film z roku 2009, za ktorý dostal Christoph Waltz Oscara za vedľajšiu rolu.
      - text: Divoký Django
        why: Film z roku 2012 priniesol Tarantinovi druhého Oscara za pôvodný scenár.
      - text: Vtedy v Hollywoode
        why: Film z roku 2019 je v zozname Tarantinových réžií.
    wrong:
      - text: Od súmraku do úsvitu
        why: Tarantino napísal scenár a zahral si v ňom, ale režíroval ho Robert Rodriguez.
      - text: True Romance
        why: Tarantino napísal scenár, ale film režíroval Tony Scott.
      - text: Klub bitkárov
        why: Film z roku 1999 režíroval David Fincher.
      - text: Mafiáni
        why: Film z roku 1990 režíroval Martin Scorsese.
      - text: Desperado
        why: Film z roku 1995 režíroval Robert Rodriguez; Tarantino sa v ňom objavil len v epizódnej úlohe.
      - text: Sedem
        why: Film z roku 1995 režíroval David Fincher.

