  - id: mario-povodne-meno
    type: choice
    prompt: Pod akým menom sa postava Maria prvýkrát objavila v arkádovej hre Donkey Kong z roku 1981?
    difficulty: 3
    source: https://en.wikipedia.org/wiki/Donkey_Kong_(1981_video_game)
    correct:
      text: Jumpman
      why: V pôvodnej arkáde mal meno Jumpman; meno Mario dostal podľa Maria Segaleho, prenajímateľa skladu Nintenda of America.
    wrong:
      - text: Plumber Joe
        why: Takto sa postava nevolala; v hre Donkey Kong bola navyše tesárom.
      - text: Luigi
        why: Luigi sa v hre Donkey Kong vôbec neobjavil; debutoval až v hre Mario Bros. (1983).
      - text: Red Cap
        why: Takto sa postava nevolala; červenú čiapku dostal, aby sa nemuseli kresliť vlasy.
