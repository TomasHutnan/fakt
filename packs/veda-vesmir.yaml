  # ---------------------------------------------------------------- pick
  - id: vesmir-mesiace
    type: pick
    prompt: Ktoré z týchto telies sú mesiace planét Slnečnej sústavy?
    difficulty: 1
    tags: [vesmír]
    source: https://en.wikipedia.org/wiki/List_of_natural_satellites
    correct:
      - text: Titan
        why: Mesiac Saturnu, druhý najväčší mesiac v Slnečnej sústave.
      - text: Europa
        why: Jeden z galileovských mesiacov Jupitera.
      - text: Phobos
        why: Mesiac Marsu.
      - text: Ganymedes
        why: Mesiac Jupitera, najväčší a najhmotnejší mesiac v Slnečnej sústave.
      - text: Triton
        why: Mesiac Neptúna s retrográdnou, teda opačnou dráhou.
      - text: Io
        why: Jeden z galileovských mesiacov Jupitera.
    wrong:
      - text: Pluto
        why: Trpasličia planéta, ktorá má sama päť mesiacov, vrátane Charona.
      - text: Ceres
        why: Trpasličia planéta, ktorá nemá žiadny známy mesiac.
      - text: Eris
        why: Trpasličia planéta s mesiacom Dysnomia.
      - text: Haumea
        why: Trpasličia planéta s mesiacmi Hiʻiaka a Namaka.
      - text: Sedna
        why: Samostatné teleso, nie mesiac planéty; nemá známy mesiac.

