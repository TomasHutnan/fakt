  # ---------------------------------------------------------------- expansion (v3)
  - id: mars-pristatia
    type: pick
    prompt: Ktoré z týchto sond a prístrojov úspešne pristáli na povrchu Marsu?
    difficulty: 2
    tags: [vesmír, Mars]
    asOf: "2026-11"
    source: https://science.nasa.gov/mission/viking/viking-50-years-on-mars/
    correct:
      - text: Viking 1
        why: Pristál 20. júla 1976, ako prvý americký úspešný pristávací modul na Marse.
      - text: Pathfinder
        why: Pristál 4. júla 1997 a vyložil malý rover Sojourner.
      - text: Spirit
        why: Rover, ktorý pristál v januári 2004.
      - text: Opportunity
        why: Rover, ktorý pristál v januári 2004 a pracoval na Marse približne 15 rokov.
      - text: Phoenix
        why: Pristál v roku 2008 pri severnom póle Marsu a kopal v ľade.
      - text: Curiosity
        why: Rover, ktorý pristál v kráteri Gale v auguste 2012.
      - text: Perseverance
        why: Rover, ktorý pristál v kráteri Jezero vo februári 2021.
    wrong:
      - text: Mariner 4
        why: V roku 1965 preletel popri Marse a odfotil ho.
      - text: Mars Reconnaissance Orbiter
        why: Obieha okolo Marsu, na povrch nepristál.
      - text: MAVEN
        why: Orbiter, ktorý skúma atmosféru Marsu z obežnej dráhy.
      - text: Mars Polar Lander
        why: V roku 1999 pri pristávaní zanikol, nepristál úspešne.
      - text: Cassini
        why: Mierila k Saturnu, nie k Marsu.
      - text: Voyager 2
        why: Preletela popri vonkajších planétach, k Marsu nemierila.

