  - id: hrad-osobnost
    type: pick
    prompt: Ktoré dvojice hradu a osobnosti alebo rodu sú správne?
    difficulty: 2
    source: https://en.wikipedia.org/wiki/Tren%C4%8D%C3%ADn_Castle
    note: Ďalšie zdroje - en.wikipedia.org/wiki/Bojnice_Castle, Orava_Castle, Spi%C5%A1_Castle, Dev%C3%ADn_Castle, Bratislava_Castle.
    tags: [hrady]
    correct:
      - text: Čachtice a Alžbeta Bátoriová
        why: Hrad dostala ako svadobný dar od Nádasdyovcov a dnes je zrúcaninou.
      - text: Beckov a Stibor zo Stiboríc
        why: Kráľ Žigmund mu ho daroval roku 1388 a Stibor z neho urobil rodové sídlo.
      - text: Bojnice a Pálffyovci
        why: Gróf Ján František Pálffy hrad v rokoch 1888 až 1910 romanticky prestaval.
      - text: Trenčín a Matúš Čák
        why: Po Pánovi Váhu a Tatier sa volá aj hradná Matúšova veža.
      - text: Orava a Thurzovci
        why: Baníckych magnátov dnes pripomína renesančná prestavba hradu.
      - text: Spiš a Csákyovci
        why: Vlastnili ho viac než tri storočia, do roku 1945.
      - text: Devín a Napoleonove vojská
        why: Pri ústupe po obliehaní Bratislavy ho v roku 1809 vyhodili do vzduchu.
    wrong:
      - text: Trenčín a Alžbeta Bátoriová
        why: Bátoriová je spojená s Čachticami, nie s Trenčínom.
      - text: Spiš a Pálffyovci
        why: Pálffyovci patrili k Bojniciam a Červenému Kameňu.
      - text: Beckov a Napoleon
        why: Napoleonove vojská zničili Devín.
      - text: Čachtice a Pribina
        why: Pribina žil o päť storočí skôr.
      - text: Bojnice a Csákyovci
        why: Csákyovci vlastnili Spiš.
      - text: Devín a Alžbeta Bátoriová
        why: Devín s Alžbetou nič spoločné nemá.

