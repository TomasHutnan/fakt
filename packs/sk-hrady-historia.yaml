id: sk-hrady-historia
title: Hrady a história
description: Hrady, zámky, UNESCO, Veľká Morava, Štúr, Štefánik, SNP a ďalšie kapitoly slovenských dejín.
lang: sk
license: CC0-1.0
adult: false
version: 1
questions:
  - id: unesco-slovensko
    type: pick
    prompt: Ktoré z týchto miest alebo lokalít sú zapísané na zozname svetového dedičstva UNESCO?
    difficulty: 2
    source: https://en.wikipedia.org/wiki/List_of_World_Heritage_Sites_in_Slovakia
    tags: [unesco]
    correct:
      - text: Banská Štiavnica
        why: Zapísaná v roku 1993 aj s technickými pamiatkami okolia.
      - text: Spišský hrad
        why: Zapísaný v roku 1993; v roku 2009 zápis rozšírili aj o Levoču.
      - text: Vlkolínec
        why: Drevená osada pri Ružomberku, kde dnes žije len zopár obyvateľov.
      - text: Bardejov
        why: Mestská pamiatková rezervácia zapísaná v roku 2000.
      - text: Jaskyne Slovenského krasu
        why: Spoločný zápis s maďarským Aggtelekom z roku 1995.
      - text: Karpatské bukové pralesy
        why: Zápis z roku 2007 zdieľa Slovensko s viacerými európskymi krajinami.
      - text: drevené kostoly v slovenských Karpatoch
        why: Osem kostolíkov (Hervartov, Tvrdošín, Kežmarok, Bodružal...) zapísaných v roku 2008.
      - text: Dunajský limes (hranica Rímskej ríše)
        why: Slovenské lokality Gerulata (Rusovce) a Celemantia (Iža) boli zapísané v roku 2021.
    wrong:
      - text: Bojnický zámok
        why: Obľúbený cieľ výletov, no na zozname UNESCO nie je.
      - text: Oravský hrad
        why: Strašil v Nosferatu, ale UNESCO ho nezapísalo.
      - text: Trenčiansky hrad
        why: Národná kultúrna pamiatka, nie svetové dedičstvo.
      - text: Devínsky hrad
        why: Slovenský zápis Dunajského limesu tvoria Gerulata a Iža, hrad Devín v ňom nie je.
      - text: Kremnica
        why: Mesto s najstaršou fungujúcou mincovňou sveta nie je v zozname UNESCO.
      - text: historické jadro Košíc
        why: Na predbežnom zozname je, ale zapísané nebolo.
      - text: Vysoké Tatry
        why: Tatry sú len na predbežnom zozname, nie zapísané.
      - text: Krásna Hôrka
        why: Slávny hrad pri Rožňave, na zozname UNESCO ho nenájdete.

  - id: velka-morava-osobnosti
    type: pick
    prompt: Ktoré osobnosti sa spájajú s dejinami Veľkej Moravy?
    difficulty: 1
    source: https://en.wikipedia.org/wiki/Great_Moravia
    tags: [velka-morava]
    correct:
      - text: Rastislav
        why: Roku 862 požiadal byzantského cisára o učiteľov viery v zrozumiteľnom jazyku.
      - text: Svätopluk I.
        why: Panoval do roku 894 a za jeho vlády bola ríša najrozsiahlejšia.
      - text: Mojmír I.
        why: Prvý známy panovník zjednotenej Moravy, ktorý podmanil Nitriansko.
      - text: Konštantín (Cyril)
        why: Spolu s bratom vytvoril hlaholiku.
      - text: Metod
        why: Zomrel v roku 885 ako arcibiskup.
      - text: cisár Michal III.
        why: Byzantský panovník, ktorý bratov na Moravu vyslal.
      - text: pápež Hadrián II.
        why: Schválil slovanskú liturgiu.
    wrong:
      - text: Matúš Čák Trenčiansky
        why: Pán Váhu a Tatier žil o pár storočí neskôr.
      - text: Mária Terézia
        why: Vládla v 18. storočí, takmer o tisícročie neskôr.
      - text: Žigmund Luxemburský
        why: Kráľ z 15. storočia.
      - text: Matej Korvín
        why: Uhorský kráľ z 15. storočia.
      - text: Samo
        why: Franský obchodník a vládca ríše zo 7. storočia, teda staršieho štátu.
      - text: Ľudovít Štúr
        why: Kodifikátor slovenčiny z 19. storočia.
      - text: Alžbeta Bátoriová
        why: Žila na prelome 16. a 17. storočia.

  - id: cyril-metod-fakty
    type: pick
    prompt: Čo platí o Konštantínovi (Cyrilovi) a Metodovi?
    difficulty: 1
    source: https://en.wikipedia.org/wiki/Cyril_and_Methodius
    tags: [velka-morava, cyril-metod]
    correct:
      - text: pochádzali zo Solúna
        why: Bratia vyrastali v byzantskom Solúne, dnešných Thessalonikách.
      - text: vytvorili hlaholiku
        why: Bola to prvá abeceda určená pre slovanský jazyk.
      - text: na Veľkú Moravu prišli v roku 863
        why: Po Rastislavovej žiadosti z roku 862.
      - text: Metod zomrel v roku 885
        why: Zomrel 6. apríla ako moravský arcibiskup.
      - text: Cyril zomrel v Ríme
        why: Krátko pred smrťou v roku 869 sa stal mníchom a prijal meno Cyril.
      - text: v roku 1980 ich pápež vyhlásil za spolupatrónov Európy
        why: Spolu so svätým Benediktom z Nursie.
      - text: 5. júl je na Slovensku štátny sviatok
        why: Pripomína príchod vierozvestcov a nie je pracovným dňom.
      - text: prekladali evanjeliá a liturgické knihy do staroslovienčiny
        why: Staroslovienčina bola prvým spisovným slovanským jazykom.
    wrong:
      - text: vytvorili azbuku
        why: Azbuka vznikla neskôr v Bulharsku a nesie meno po Cyrilovi len pamätne.
      - text: pochádzali z Ríma
        why: Boli to Gréci z Byzantskej ríše.
      - text: na Moravu ich pozval Svätopluk
        why: Pozval ich knieža Rastislav, Svätopluk bol jeho synovec a nástupca.
      - text: poslal ich pápež
        why: Vyslal ich byzantský cisár Michal III.
      - text: preložili celú Bibliu do slovenčiny
        why: Prekladali do staroslovienčiny a nie celú Bibliu naraz.
      - text: Cyril sa nikdy nestal mníchom
        why: Mníchom sa stal tesne pred smrťou.

  - id: snp-fakty
    type: pick
    prompt: Čo platí o Slovenskom národnom povstaní?
    difficulty: 1
    source: https://en.wikipedia.org/wiki/Slovak_National_Uprising
    tags: [snp, 1944]
    correct:
      - text: začalo sa v lete 1944
        why: Oficiálne sa počíta od 29. augusta 1944, keď na Slovensko vstúpila nemecká armáda.
      - text: jeho centrom bola Banská Bystrica
        why: Mesto sa stalo hlavným mestom povstaleckého územia.
      - text: prvým veliteľom bol Ján Golian
        why: Po zhruba 40 dňoch ho vystriedal generál Rudolf Viest.
      - text: Viest velil povstaniu od októbra 1944
        why: Funkciu prevzal 7. októbra.
      - text: politicky ho viedla Slovenská národná rada
        why: Zložená z predstaviteľov občianskeho odboja a komunistov.
      - text: Banská Bystrica padla 27. októbra 1944
        why: Armáda potom prešla do partizánskeho boja.
    wrong:
      - text: viedol ho prezident Jozef Tiso
        why: Tiso stál na opačnej strane, bol prezidentom vtedajšieho Slovenského štátu.
      - text: jeho centrom bol Poprad
        why: Hlavné povstalecké mesto bola Banská Bystrica.
      - text: začalo sa v roku 1939
        why: Rok 1939 je vznik Slovenského štátu.
      - text: trvalo len niekoľko dní
        why: Regulárny odpor trval takmer dva mesiace.
      - text: povstaleckú armádu viedol M. R. Štefánik
        why: Štefánik zomrel už v roku 1919.
      - text: skončilo sa na Vianoce 1944
        why: Regulárny odpor sa skončil koncom októbra.

  - id: okupacia-1968
    type: pick
    prompt: Vojská ktorých krajín v auguste 1968 vtrhli do Československa?
