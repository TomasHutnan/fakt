        why: Hlavná invazná sila, spolu s ďalšími krajinami vtrhla do krajiny v noci 20. na 21. augusta.
      - text: Poľsko
        why: Poľská armáda sa na invázii zúčastnila.
      - text: Maďarsko
        why: Maďarské jednotky boli súčasťou invázie.
      - text: Bulharsko
        why: Aj Bulhari poslali vojakov.
    wrong:
      - text: Rumunsko
        why: Hoci bolo členom Varšavskej zmluvy, odmietlo sa zúčastniť a inváziu verejne odsúdilo.
      - text: Albánsko
        why: Zúčastniť sa odmietlo a z Varšavskej zmluvy neskôr vystúpilo.
      - text: Juhoslávia
        why: Nebola v bloku, invázia ju ostro pobúrila.
      - text: Kuba
        why: Bola ďaleko a neposlala nikoho.
      - text: Čína
        why: Vtedy bola v konflikte so Sovietskym zväzom a neposlala nikoho.
      - text: Mongolsko
        why: Do Československa žiadne vojsko neposlalo.
      - text: Fínsko
        why: Neutrálna krajina mimo Varšavskej zmluvy.
      - text: Rakúsko
        why: Neutrálny sused, ktorý zostal bokom.

  - id: spissky-hrad-fakty
    type: pick
    prompt: Čo platí o Spišskom hrade?
    difficulty: 3
