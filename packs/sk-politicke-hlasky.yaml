      - { text: "Z dlhodobého hľadiska sme všetci mŕtvi", why: "Povedal Richard Sulík v novembri 2020 pri nákupe antigénových testov." }
      - { text: "My nechceme za šéfa RTS bezdomovca", why: "Povedal minister kultúry Daniel Krajcer v roku 2010." }
