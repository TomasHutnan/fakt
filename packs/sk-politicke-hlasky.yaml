      - { text: "Ťažko vládzem, fakt som dosť popil", why: "Rádio Expres, máj 2019, deň po prehre slovenských hokejistov s Kanadou." }
      - { text: "Žiaden človek nedokáže dať toľko lásky človeku, ako dokáže dať len človek človeku", why: "Odovzdávanie ocenení Spravodliví medzi národmi, január 2017." }
      - { text: "V živote nepoužívam papier, keď čítam", why: "Denník N túto vetu uviedol medzi Dankovými prerieknutiami vo výbere za rok 2016." }
      - { text: "Asi by som rozmýšľal skôr, než sa zamyslím", why: "Povedal v pléne v roku 2024; chcel povedať, že sa treba zamyslieť skôr, než niečo povie." }
      - { text: "Prinášame nové opatrenia, aby čašníci neplatili tringelty", why: "Rok 2024; v skutočnosti chcel tringelty oslobodiť od daní." }
      - { text: "Nie je nič horšie, ako sa vyzliecť skôr, ako vojdeš do vody", why: "Jeho rada z diskusnej relácie v roku 2024." }
      - { text: "Trošku sa mám na pozore, keď vidím toľko lásky medzi Eštokom a Kaliňákom", why: "Príhovor na sneme Smeru v roku 2024." }
