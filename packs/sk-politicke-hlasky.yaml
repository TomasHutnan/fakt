id: sk-politicke-hlasky
title: Politické hlášky
description: Zľudovené výroky, brepty a trapasy slovenských (a pár česko-slovenských) politikov od roku 1989. Kto to povedal, kedy a pri akej príležitosti? Občas vulgárne, 18+.
