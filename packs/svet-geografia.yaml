        why: Hranica vedie hlavne po Odre a Nise.
      - text: Česko
        why: Spoločná hranica na východe.
      - text: Rakúsko
        why: Hranica na juhovýchode.
      - text: Švajčiarsko
        why: Hranica na juhu, pri Bodamskom jazere.
      - text: Francúzsko
        why: Na západe, veľká časť hranice vedie po Rýne.
      - text: Luxembursko
        why: Malé veľkovojvodstvo na západe.
      - text: Belgicko
        why: Hranica na západe.
      - text: Holandsko
        why: Hranica na severozápade.
    wrong:
      - text: Taliansko
        why: S Nemeckom nesusedí, medzi nimi leží Rakúsko a Švajčiarsko.
      - text: Maďarsko
        why: Nesusedí, medzi nimi je Rakúsko.
      - text: Slovensko
        why: Nesusedí, medzi nami je Česko a Rakúsko.
      - text: Švédsko
        why: Od Nemecka ho delí Baltské more.
      - text: Slovinsko
        why: Nesusedí, medzi nimi je Rakúsko.
      - text: Lichtenštajnsko
        why: Nemecko s ním nemá spoločnú hranicu, oddeľuje ich Rakúsko a Švajčiarsko.

