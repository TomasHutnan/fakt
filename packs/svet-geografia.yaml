id: svet-geografia
title: Svet a zemepis
description: Hlavné mestá, susedia, rieky, vrchy, vlajky, meny a slávne pamiatky z celého sveta.
lang: sk
version: 1
questions:
  - id: hlavne-mesta-miesanie
    type: pick
    prompt: Ktoré z týchto miest sú hlavnými mestami svojich štátov?
    difficulty: 1
    source: https://en.wikipedia.org/wiki/List_of_national_capitals
    correct:
      - text: Canberra
        why: Hlavné mesto Austrálie; vzniklo ako kompromis medzi rivalmi Sydney a Melbourne.
      - text: Ankara
        why: Hlavné mesto Turecka, nie Istanbul.
      - text: Brasília
        why: Hlavné mesto Brazílie, nie Rio de Janeiro.
      - text: Bern
        why: Švajčiarsko má Bern ako de facto hlavné mesto, nie Zürich ani Ženevu.
      - text: Abuja
        why: Hlavné mesto Nigérie; najväčšie mesto Lagos to nie je.
      - text: Astana
        why: Hlavné mesto Kazachstanu, nie bývalé Almaty.
      - text: Dodoma
        why: Hlavné mesto Tanzánie; Dar es Salaam je bývalé hlavné mesto.
    wrong:
      - text: Sydney
        why: Najväčšie mesto Austrálie, ale hlavné je Canberra.
      - text: Melbourne
        why: Austrálske mesto, ale hlavné mesto je Canberra.
      - text: Istanbul
        why: Najväčšie mesto Turecka, hlavné je Ankara.
      - text: Rio de Janeiro
        why: Brazílske mesto, hlavné mesto je Brasília.
      - text: Zürich
        why: Najväčšie švajčiarske mesto, hlavné je Bern.
      - text: Lagos
        why: Najväčšie mesto Nigérie, hlavné je Abuja.
      - text: Almaty
        why: Bývalé hlavné mesto Kazachstanu, dnes je ním Astana.
      - text: Dar es Salaam
        why: Bývalé hlavné mesto Tanzánie; dnes je ním Dodoma.

  - id: susedia-nemecka
    type: pick
    prompt: S ktorými štátmi má Nemecko spoločnú pozemnú hranicu?
