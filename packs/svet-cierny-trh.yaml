      - { text: "Potenciálna výroba čistého kokaínu je od roku 2014 viac než štvornásobná", why: "UNODC ju v roku 2024 odhaduje na približne 4 100 ton." }
      - { text: "Kolumbia sa podieľa asi 40 % na svetových zaisteniach kokaínu", why: "Správa uvádza 966 ton, teda 40 % svetového súčtu." }
      - { text: "Asi 64 % svetových zaistení kokaínu sa urobilo v Južnej Amerike", why: "Je to najvyšší podiel od roku 1984." }
      - { text: "Kokaín užilo za rok 2024 odhadom 25 miliónov ľudí", why: "Je to o 38 % viac než pred desiatimi rokmi." }
      - { text: "Okolo 70 % užívateľov žije na americkom kontinente, v západnej a strednej Európe a v Austrálii a na Novom Zélande", why: "Ide o dlhodobo najsilnejšie trhy; v Afrike a Ázii sa trh rozrastá." }
    wrong:
      - { text: "Výroba kokaínu od roku 2014 klesla na polovicu", why: "Vzrástla viac než štvornásobne." }
      - { text: "Najviac kokaínu sa zaisťuje v Ázii", why: "Najväčší podiel zaistení, asi 64 %, pripadá na Južnú Ameriku." }
      - { text: "Kokaín užíva viac ľudí než konope", why: "Konope užilo okolo 256 miliónov ľudí, kokaín okolo 25 miliónov." }
      - { text: "Väčšina užívateľov kokaínu žije v Ázii", why: "Hlavnými trhmi sú Amerika, západná a stredná Európa a Oceánia." }
      - { text: "Kolumbia zaisťuje menej než 5 % svetového množstva", why: "Podľa správy je to asi 40 %." }

