      - { text: "andouillette – Francúzsko", why: "Francúzska klobása z bravčových čriev s výrazným zápachom." }
      - { text: "lutefisk – Nórsko", why: "Sušená treska namáčaná v lúhu, súčasť nórskeho vianočného stola julebord." }
      - { text: "kiviak – Grónsko", why: "Zimná pochúťka Inuitov z Grónska: vtáky kvasené v tulenej koži." }
      - { text: "želé z úhorov – Anglicko", why: "Jellied eels pochádzajú z londýnskeho East Endu z 18. storočia." }
