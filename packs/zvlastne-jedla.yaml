    source: https://en.wikipedia.org/wiki/Surstr%C3%B6mming
    note: "Ďalšie zdroje: en.wikipedia.org/wiki/Hákarl, /Casu_martzu, /Haggis, /Andouillette, /Lutefisk, /Kiviak, /Jellied_eels"
