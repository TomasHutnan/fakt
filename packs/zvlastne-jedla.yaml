id: zvlastne-jedla
title: Zvláštne jedlá sveta
description: Balut, hákarl, surströmming, syr s červíkmi, vyprážané tarantuly aj naša krvavnička. Pochúťky, pri ktorých sa jedni oblizujú a druhí odvracajú zrak.
category: jedlo
lang: sk
adult: false
defaultOn: false
warnings: [gross]
version: 2
questions:
  - id: zj-krajiny-europa
    type: pick
    prompt: "Európa a sever: ktoré dvojice „jedlo – krajina, kde je to tradičné jedlo“ sedia?"
