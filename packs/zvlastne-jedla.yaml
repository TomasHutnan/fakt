      - { text: "hákarl – Island", why: "Kvasený žralok je islandské národné jedlo, najmä na zimnom sviatku þorrablót." }
      - { text: "casu marzu – Taliansko", why: "Ovčí syr so živými larvami zo Sardínie." }
