      - { text: "a + b = c² (Pytagorova veta)", why: "Na druhú sú všetky tri strany: a² + b² = c²." }
      - { text: "U = R / I (Ohmov zákon)", why: "U = R · I, delí sa až pri výpočte odporu R = U / I." }
      - { text: "S = 2 · π · r (obsah kruhu)", why: "To je obvod; obsah je π · r²." }
      - { text: "F = m / a (druhý Newtonov zákon)", why: "Sila je m · a, nie podiel." }
      - { text: "p = F · S (tlak)", why: "Tlak je F / S; čím väčšia plocha, tým menší tlak." }
      - { text: "E = m · c (Einstein)", why: "Rýchlosť svetla je na druhú." }

