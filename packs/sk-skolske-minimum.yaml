id: sk-skolske-minimum
title: Školské minimum
description: Povinné čítanie, štúrovci, vybrané slová, pády, vzorce, periodická tabuľka a zemepis. Všetko, čo sme sa v škole učili a napoly zabudli.
lang: sk
license: CC0-1.0
adult: false
version: 1
questions:
  # ---------- pick ----------
  - id: pseudonymy-spisovatelov
    type: pick
    prompt: "Ktoré dvojice pseudonymu a skutočného mena spisovateľa sú správne?"
    difficulty: 2
    source: https://sk.wikipedia.org/wiki/Ivan_Krasko
    note: "Ďalšie zdroje - sk.wikipedia.org/wiki/Andrej_Sládkovič, Jozef_Gregor_Tajovský, Ladislav_Nádaši-Jégé, Svetozár_Hurban-Vajanský, Pavol_Országh_Hviezdoslav, Martin_Kukučín, Timrava."
    tags: [literatúra, pseudonymy]
    correct:
      - { text: "Ivan Krasko – Ján Botto", why: "Áno, volal sa rovnako ako štúrovský básnik Ján Botto, autor Smrti Jánošíkovej." }
      - { text: "Andrej Sládkovič – Andrej Braxatoris", why: "Autor Maríny písal pod pseudonymom, rodné meno mal Braxatoris." }
      - { text: "Jozef Gregor Tajovský – Jozef Gregor", why: "Prídomok Tajovský má podľa rodnej obce Tajov." }
      - { text: "Jégé – Ladislav Nádaši", why: "Lekár z Dolného Kubína, autor Adama Šangalu." }
      - { text: "Vajanský – Svetozár Hurban", why: "Syn štúrovca Jozefa Miloslava Hurbana." }
      - { text: "Hviezdoslav – Pavol Országh", why: "Rodák z Vyšného Kubína, povolaním právnik." }
      - { text: "Martin Kukučín – Matej Bencúr", why: "Rodák z Jasenovej, povolaním lekár, zakladateľ modernej slovenskej prózy." }
      - { text: "Timrava – Božena Slančíková", why: "Pochádzala z Polichna, písala aj ako Teta z Polichna." }
    wrong:
      - { text: "Ivan Krasko – Matej Bencúr", why: "Matej Bencúr je Martin Kukučín." }
      - { text: "Andrej Sládkovič – Ján Kalinčiak", why: "Kalinčiak bol iný štúrovec, autor Reštavrácie, a písal pod vlastným menom." }
      - { text: "Martin Kukučín – Jozef Gregor", why: "Jozef Gregor je Tajovský." }
      - { text: "Timrava – Terézia Vansová", why: "Vansová bola iná spisovateľka; Timrava sa volala Božena Slančíková." }
      - { text: "Hviezdoslav – Andrej Braxatoris", why: "Braxatoris je Sládkovič, Hviezdoslav sa volal Pavol Országh." }
      - { text: "Jozef Gregor Tajovský – Ladislav Nádaši", why: "Nádaši je Jégé." }

