  - id: vzorce
    type: pick
    prompt: "Ktoré z týchto školských vzorcov sú správne?"
    difficulty: 1
    source: https://sk.wikipedia.org/wiki/Pytagorova_veta
    note: "Ďalšie zdroje - sk.wikipedia.org/wiki/Ohmov_zákon, sk.wikipedia.org/wiki/Kruh, sk.wikipedia.org/wiki/Tlak, en.wikipedia.org/wiki/Newton%27s_laws_of_motion, en.wikipedia.org/wiki/Mass%E2%80%93energy_equivalence."
    tags: [matematika, fyzika]
    correct:
      - { text: "a² + b² = c² (Pytagorova veta)", why: "Platí pre pravouhlý trojuholník, c je prepona." }
      - { text: "U = R · I (Ohmov zákon)", why: "Napätie je odpor krát prúd." }
      - { text: "S = π · r² (obsah kruhu)", why: "Pí er na druhú." }
      - { text: "O = 2 · π · r (obvod kruhu)", why: "Dva pí er." }
      - { text: "F = m · a (druhý Newtonov zákon)", why: "Sila je hmotnosť krát zrýchlenie." }
      - { text: "p = F / S (tlak)", why: "Tlak je sila na plochu." }
      - { text: "E = m · c² (Einstein)", why: "Ekvivalencia hmotnosti a energie z roku 1905." }
