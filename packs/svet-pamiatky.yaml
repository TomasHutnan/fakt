id: svet-pamiatky
title: Pamiatky sveta a UNESCO
description: "Slávne stavby a kde stoja, zázraky sveta starovekého aj moderného, najnavštevovanejšie miesta, rekordné výšky a zoznam svetového dedičstva UNESCO."
category: zemepis
lang: sk
license: CC0-1.0
adult: false
version: 3
questions:
  # ================================================================ ZÁZRAKY SVETA
  - id: pam-novych-7-zazrakov
    type: pick
    prompt: "Ktoré z týchto pamiatok zvíťazili v internetovej ankete Nových sedem divov sveta z roku 2007?"
    difficulty: 2
    tags: [zázraky, pamiatky]
    source: "https://en.wikipedia.org/wiki/New7Wonders_of_the_World"
    correct:
      - { text: "Petra", why: "Skalné mesto Nabatejcov v Jordánsku; do ankety sa dostalo ako jedna zo siedmich víťazných pamiatok." }
      - { text: "Koloseum", why: "Rímsky amfiteáter, dokončený v roku 80 n. l., je jediným víťazom z Európy." }
      - { text: "Chichén Itzá", why: "Mayské mesto na Yucatáne v Mexiku s pyramídou El Castillo." }
      - { text: "Veľký čínsky múr", why: "Tiahne sa naprieč severom Číny; stavať sa začal už pred viac než dvoma tisícročiami." }
      - { text: "Machu Picchu", why: "Inkské mesto v Peru; v krajine ho po víťazstve oslavovali celonárodne." }
      - { text: "Tádž Mahal", why: "Mauzóleum v Agre, ktoré dal postaviť šáh Džahán pre manželku." }
      - { text: "Socha Krista Spasiteľa", why: "Rio de Janeiro viedlo masívnu kampaň; socha z roku 1931 je najmladšia z víťazov." }
    wrong:
      - { text: "Angkor Wat", why: "Bol medzi 21 finalistami, ale medzi sedem víťazov sa nedostal." }
      - { text: "Alhambra", why: "Granadský palác bol finalistom, no nezvíťazil." }
      - { text: "Eiffelova veža", why: "Medzi finalistami bola, no neprešla do prvej siedmičky." }
      - { text: "Socha Slobody", why: "Finalistka, ktorá medzi víťazov nepatrila." }
      - { text: "Hagia Sofia", why: "Finalistka z Istanbulu; víťazom sa nestala." }
      - { text: "Stonehenge", why: "Finalista s vekom okolo 4 400 rokov, ale bez víťazstva." }
      - { text: "Akropola v Aténach", why: "Bola medzi finalistami, ale neprešla." }
      - { text: "Opera v Sydney", why: "Najmladší finalista z roku 1973, víťazom sa nestal." }
      - { text: "Kremeľ a Červené námestie", why: "Ruský finalista, ktorý neuspel." }

  - id: pam-starovek-7-zazrakov
    type: pick
    prompt: "Ktoré z týchto stavieb patrili medzi tradičných sedem divov starovekého sveta?"
    difficulty: 2
    tags: [zázraky, starovek]
    source: "https://en.wikipedia.org/wiki/Seven_Wonders_of_the_Ancient_World"
    correct:
      - { text: "Veľká pyramída v Gíze", why: "Jediná zo siedmich, ktorá stojí dodnes." }
      - { text: "Semiramidine visuté záhrady", why: "Ich existencia je dodnes nepotvrdená." }
      - { text: "Socha Dia v Olympii", why: "Stála v Olympii v Grécku, kde sa konali staroveké olympijské hry." }
      - { text: "Artemidin chrám v Efeze", why: "Efez leží v dnešnom Turecku." }
      - { text: "Mauzóleum v Halikarnasse", why: "Hrobka vládcu Mausola dala všetkým „mauzóleám“ meno." }
      - { text: "Rodoský kolos", why: "Obrovská socha boha slnka Hélia na gréckom ostrove Rodos." }
      - { text: "Alexandrijský maják", why: "Maják v egyptskej Alexandrii; jeho ostatky zmizli v stredoveku." }
    wrong:
      - { text: "Parthenón", why: "Slávny chrám Atény na aténskej Akropole, no na kanonický zoznam sa nedostal." }
      - { text: "Stonehenge", why: "Prehistorická stavba v Anglicku, nie súčasť tradičnej siedmičky." }
      - { text: "Petra", why: "Nabatejské mesto v Jordánsku; do zázrakov sa dostalo až v ankete z roku 2007." }
      - { text: "Veľký čínsky múr", why: "Medzi starovekými zázrakmi nefiguruje; tradičný zoznam je stredomorský." }
      - { text: "Hagia Sofia", why: "Postavili ju až v roku 537 n. l., teda dávno po antických zoznamoch." }
      - { text: "Perzepolis", why: "Ceremoniálne hlavné mesto Achaimenovskej ríše; v kanonickom zozname nie je." }
      - { text: "Alhambra", why: "Stredoveký maurský palác, až príliš mladý na zoznam z antiky." }
      - { text: "Terakotová armáda", why: "Pochádza z čínskej hrobky cisára Čchin Š’-chuang-tiho, nie zo stredomorského zoznamu." }

