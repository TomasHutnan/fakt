    tags: [hokej, nhl]
    correct:
      - text: Marián Hossa
        why: Tri tituly s Chicagom (2010, 2013, 2015), predtým prehral dve finále s inými tímami.
      - text: Zdeno Chára
        why: V roku 2011 ako kapitán Bostonu, prvý Slovák, ktorý dvihol pohár nad hlavu ako kapitán.
      - text: Miroslav Šatan
        why: S Pittsburghom 2009, hoci do play-off nastúpil iba deväťkrát.
      - text: Marián Gáborík
        why: S Los Angeles Kings 2014; v tom play-off strelil 14 gólov, najviac zo všetkých.
      - text: Tomáš Kopecký
        why: Vyhral dvakrát v dvoch rôznych kluboch, 2008 s Detroitom a 2010 s Chicagom.
      - text: Michal Handzuš
        why: Pohár získal s Chicagom v roku 2013.
      - text: Erik Černák
        why: Obranca Tampy Bay, s ktorou vyhral v rokoch 2020 a 2021.
    wrong:
      - text: Peter Bondra
        why: Vo finále bol raz (1998 s Washingtonom), ale Detroit ich vymetol 4:0.
      - text: Žigmund Pálffy
        why: Takmer 700 zápasov v NHL, pohár však nikdy nezdvihol.
      - text: Juraj Slafkovský
        why: Zatiaľ nevyhral; bol draftovaný ako jednotka, ale pohár nemá.
      - text: Pavol Demitra
        why: Výborný útočník, no Stanleyho pohár mu nikdy nepripadol.
      - text: Ľubomír Višňovský
        why: Slovenský obranca s dlhou kariérou v NHL, pohár však nezískal.
      - text: Šimon Nemec
        why: Druhý v drafte 2022, pohár v zozname slovenských víťazov nefiguruje.

