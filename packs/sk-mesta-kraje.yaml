questions:
  - id: susedia-slovenska
    type: pick
    prompt: S ktorými krajinami má Slovensko spoločnú pozemnú hranicu?
    difficulty: 1
    source: https://en.wikipedia.org/wiki/Slovakia
    tags: [hranice]
    correct:
      - { text: Česko, why: Do roku 1993 sme boli jeden štát. }
      - { text: Poľsko, why: Hranica vedie hlavne po horách, napríklad cez Tatry. }
      - { text: Ukrajina, why: Najvýchodnejší sused, hlavný priechod je pri Vyšnom Nemeckom. }
      - { text: Maďarsko, why: Dlhá južná hranica, veľká časť vedie po Dunaji a Ipli. }
      - { text: Rakúsko, why: Susedí priamo s Bratislavou. }
    wrong:
      - { text: Rumunsko, why: Medzi nami leží Maďarsko alebo Ukrajina. }
      - { text: Slovinsko, why: Medzi nami leží Rakúsko alebo Maďarsko. }
      - { text: Nemecko, why: Je to blízko, ale medzi nami leží Rakúsko a Česko. }
      - { text: Chorvátsko, why: Spoločnú hranicu nemáme, leží medzi nami Maďarsko. }
      - { text: Srbsko, why: Medzi nami a Srbskom leží Maďarsko. }
      - { text: Bielorusko, why: Priamo nesusedí, je za Poľskom alebo Ukrajinou. }
      - { text: Litva, why: Je to ďaleko, medzi nami je Poľsko. }
      - { text: Moldavsko, why: Je za Ukrajinou. }

