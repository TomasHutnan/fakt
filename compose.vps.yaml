# Production on the VPS. caddy-docker-proxy and homepage find the service through
# its labels, on the shared `web` network. No port is published.
#
# Values come from .env next to this file, copied from .env.example. Compose reads
# it by itself. Never put real values in this file: the repository is public.
#
#   docker compose up -d                                 start
#   docker compose pull && docker compose up -d          update
services:
  fakt:
    image: ghcr.io/tomashutnan/fakt:${FAKT_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Rooms accept WebSocket connections only from this origin.
      - FAKT_PUBLIC_ORIGIN=https://${FAKT_DOMAIN:?set it in .env}
      # Abuse limits; defaults in .env.example.
      - FAKT_MAX_ROOMS=${FAKT_MAX_ROOMS:-200}
      - FAKT_ROOMS_PER_IP=${FAKT_ROOMS_PER_IP:-3}
      - FAKT_CREATES_PER_10MIN=${FAKT_CREATES_PER_10MIN:-6}
      - FAKT_MAX_CONNECTIONS=${FAKT_MAX_CONNECTIONS:-600}
      - FAKT_CONNECTIONS_PER_IP=${FAKT_CONNECTIONS_PER_IP:-40}
      - FAKT_MAX_PACK_MB=${FAKT_MAX_PACK_MB:-48}
      - FAKT_ROOM_TTL_MINUTES=${FAKT_ROOM_TTL_MINUTES:-60}
      # Keeps Node's heap below the container limit.
      - NODE_OPTIONS=--max-old-space-size=${FAKT_HEAP_MB:-160}
    volumes:
      # Room snapshots across restarts. Must be owned by uid 1000.
      - ${FAKT_DATA_PATH:?set it in .env}:/data
    networks:
      - web
    # Hard caps, so a flood of rooms cannot starve the other services on the VPS.
    mem_limit: ${FAKT_MEM_LIMIT:-256m}
    cpus: ${FAKT_CPUS:-0.5}
    pids_limit: 64
    # Only /data is writable, and the process runs as uid 1000.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    labels:
      caddy: ${FAKT_DOMAIN}
      caddy.encode: zstd gzip
      caddy.reverse_proxy: "{{upstreams 8080}}"
      homepage.group: Services
      homepage.name: Fakt?
      homepage.href: https://${FAKT_DOMAIN}
      homepage.description: Quiz game
      homepage.icon: mdi-help-box

networks:
  web:
    external: true
